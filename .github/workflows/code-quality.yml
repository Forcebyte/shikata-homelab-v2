name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install markdownlint
      run: npm install -g markdownlint-cli

    - name: Lint Markdown files
      run: |
        markdownlint . --ignore node_modules --ignore .git || true

  structure-validation:
    name: Repository Structure Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate directory structure
      run: |
        echo "Validating repository structure..."
        
        # Check for required directories
        required_dirs=("k8s" "terraform" ".github/workflows")
        for dir in "${required_dirs[@]}"; do
          if [ ! -d "$dir" ]; then
            echo "❌ Required directory missing: $dir"
            exit 1
          else
            echo "✅ Found required directory: $dir"
          fi
        done

    - name: Check for kustomization files
      run: |
        echo "Checking for kustomization files in k8s directories..."
        find k8s/ -type d -mindepth 2 | while read -r dir; do
          if [ ! -f "$dir/kustomization.yaml" ] && [ ! -f "$dir/kustomization.yml" ]; then
            echo "⚠️ Missing kustomization file in: $dir"
          fi
        done

    - name: Validate Terraform structure
      run: |
        echo "Validating Terraform structure..."
        if [ ! -f "terraform/providers.tf" ]; then
          echo "⚠️ Missing providers.tf in terraform/"
        fi
        if [ ! -f "terraform/variables.tf" ]; then
          echo "⚠️ Missing variables.tf in terraform/"
        fi

    - name: Check for documentation
      run: |
        echo "Checking for documentation files..."
        
        # Check main README
        if [ ! -f "README.md" ]; then
          echo "❌ Missing README.md"
          exit 1
        fi
        echo "✅ Found README.md"
        
        # Check component READMEs
        if [ -f "k8s/README.md" ]; then
          echo "✅ Found k8s/README.md"
        else
          echo "⚠️  Missing k8s/README.md"
        fi
        
        if [ -f "terraform/README.md" ]; then
          echo "✅ Found terraform/README.md"
        else
          echo "⚠️  Missing terraform/README.md"
        fi
        
        if [ -f "qemu/README.md" ]; then
          echo "✅ Found qemu/README.md"
        else
          echo "⚠️  Missing qemu/README.md"
        fi
        
        # Check CONTRIBUTING guide
        if [ -f "CONTRIBUTING.md" ]; then
          echo "✅ Found CONTRIBUTING.md"
        else
          echo "⚠️  Missing CONTRIBUTING.md"
        fi

    - name: Validate documentation completeness
      run: |
        echo "Validating documentation completeness..."
        
        # Check README has key sections
        required_sections=("Prerequisites" "Getting Started" "Usage" "Contributing")
        
        for section in "${required_sections[@]}"; do
          if grep -qi "$section" README.md; then
            echo "✅ README contains '$section' section"
          else
            echo "⚠️  README missing '$section' section"
          fi
        done
        
        # Check README word count (should be substantial)
        word_count=$(wc -w < README.md)
        echo "README.md word count: $word_count"
        
        if [ $word_count -gt 500 ]; then
          echo "✅ README has substantial content"
        else
          echo "⚠️  README is quite short, consider adding more details"
        fi

  integration-check:
    name: Integration and Consistency Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup tools
      run: |
        # Install yq for YAML parsing
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Check Terraform and K8s consistency
      run: |
        echo "Checking consistency between Terraform and Kubernetes configs..."
        
        # Extract namespaces created by Terraform secrets
        terraform_namespaces=$(grep -r 'namespace\s*=' terraform/*.tf | grep -v '#' | awk -F'"' '{print $2}' | sort -u)
        
        echo "Namespaces referenced in Terraform:"
        echo "$terraform_namespaces"
        
        # Extract namespaces from K8s manifests
        k8s_namespaces=$(find k8s/apps -name "*.yaml" -o -name "*.yml" | xargs grep '^\s*namespace:' | awk '{print $2}' | sort -u)
        
        echo ""
        echo "Namespaces used in K8s manifests:"
        echo "$k8s_namespaces"

    - name: Check for common issues
      run: |
        echo "Scanning for common issues..."
        
        # Check for hardcoded secrets (basic check)
        echo "Checking for potential hardcoded secrets..."
        if grep -r -i "password\s*:\s*['\"]" k8s/ terraform/ --include="*.yaml" --include="*.yml" --include="*.tf" | grep -v "var\." | grep -v "secret" | grep -v "#"; then
          echo "⚠️  Found potential hardcoded passwords"
        else
          echo "✅ No obvious hardcoded passwords found"
        fi
        
        # Check for TODO/FIXME comments
        echo ""
        echo "Checking for TODO/FIXME comments..."
        todo_count=$(grep -r -i "TODO\|FIXME" k8s/ terraform/ --include="*.yaml" --include="*.yml" --include="*.tf" 2>/dev/null | wc -l || echo "0")
        echo "TODO/FIXME comments found: $todo_count"
        
        if [ "$todo_count" -gt 0 ]; then
          echo "Items requiring attention:"
          grep -r -i "TODO\|FIXME" k8s/ terraform/ --include="*.yaml" --include="*.yml" --include="*.tf" 2>/dev/null || true
        fi

    - name: Check file permissions
      run: |
        echo "Checking for executable files that shouldn't be..."
        
        # Find YAML and markdown files that are executable
        executable_yaml=$(find . -name "*.yaml" -o -name "*.yml" -o -name "*.md" | xargs ls -l | grep "^-rwxr" || echo "")
        
        if [ -n "$executable_yaml" ]; then
          echo "⚠️  Found executable YAML/MD files (should not be executable):"
          echo "$executable_yaml"
        else
          echo "✅ No incorrectly executable files found"
        fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [markdown-lint, structure-validation, integration-check]
    if: always()
    
    steps:
    - name: Summary
      run: |
        echo "=========================================="
        echo "Code Quality Test Summary"
        echo "=========================================="
        echo "All code quality checks completed."
        echo "Review the individual job outputs for details."