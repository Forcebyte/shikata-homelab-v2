name: Secrets Detection

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better secret detection

    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

    - name: Run GitLeaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}} # Only required for Organizations, not personal accounts.

    - name: Run detect-secrets
      run: |
        pip install detect-secrets
        detect-secrets scan --all-files --baseline .secrets.baseline || true
        if [ -f .secrets.baseline ]; then
          detect-secrets audit .secrets.baseline
        fi

  file-validation:
    name: File Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for sensitive file patterns
      run: |
        echo "Checking for potentially sensitive files..."
        
        # Check for common sensitive files
        find . -name "*.pem" -o -name "*.key" -o -name "*.p12" -o -name "*.pfx" \
               -o -name "id_rsa*" -o -name "id_dsa*" -o -name "*.ppk" \
               -o -name ".env" -o -name ".env.*" \
               -o -name "terraform.tfvars" -o -name "*.tfvars" | while read -r file; do
          if [ -f "$file" ]; then
            echo "⚠️ Potentially sensitive file found: $file"
          fi
        done

    - name: Check file permissions
      run: |
        echo "Checking for files with suspicious permissions..."
        find . -type f \( -perm -4000 -o -perm -2000 \) -ls || true

    - name: Validate JSON files
      run: |
        echo "Validating JSON files..."
        find . -name "*.json" -type f -exec sh -c '
          for file do
            echo "Validating: $file"
            python -m json.tool "$file" > /dev/null || echo "❌ Invalid JSON: $file"
          done
        ' sh {} +

    - name: Check for hardcoded IPs and URLs
      run: |
        echo "Scanning for hardcoded IPs and URLs..."
        grep -r -E "([0-9]{1,3}\.){3}[0-9]{1,3}" . --include="*.yaml" --include="*.yml" --include="*.tf" || true
        echo "---"
        grep -r -E "https?://[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}" . --include="*.yaml" --include="*.yml" --include="*.tf" || true