name: Kubernetes Lint

on:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'k8s/**'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  kubernetes-lint:
    name: Kubernetes Manifest Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Validate kustomization files
      run: |
        # Find all kustomization.yaml files and validate them
        find k8s/ -name 'kustomization.yaml' -o -name 'kustomization.yml' | while read -r file; do
          echo "Validating kustomization in $(dirname "$file")"
          cd "$(dirname "$file")"
          kustomize build . > /dev/null
          cd - > /dev/null
        done

    - name: Setup kubeconform
      run: |
        curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
        sudo mv kubeconform /usr/local/bin

    - name: Validate with kubeconform
      run: |
        find k8s/ -name '*.yaml' -o -name '*.yml' | xargs kubeconform -strict -verbose

    - name: Setup Polaris
      run: |
        curl -L https://github.com/FairwindsOps/polaris/releases/latest/download/polaris_linux_amd64.tar.gz | tar xz
        sudo mv polaris /usr/local/bin

    - name: Run Polaris audit
      run: |
        # Create a temporary config to run Polaris on files
        find k8s/ -name '*.yaml' -o -name '*.yml' | xargs polaris audit --audit-path

    - name: Setup YAML Lint
      run: |
        pip install yamllint

    - name: Lint YAML files
      run: |
        yamllint k8s/ || true  # Non-blocking for now, just informational

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: 'k8s/'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'