name: Kubernetes Lint

on:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'k8s/**'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  kubernetes-lint:
    name: Kubernetes Manifest Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kustomize
      run: |
        # Pinned direct download: install_kustomize.sh queries the GitHub API
        # for the latest release and trips the unauthenticated rate limit
        # on shared runners.
        curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz" | tar xz
        sudo mv kustomize /usr/local/bin/

    - name: Validate kustomization files
      run: |
        # Find all kustomization.yaml files and validate them
        find k8s/ -name 'kustomization.yaml' -o -name 'kustomization.yml' | while read -r file; do
          echo "Validating kustomization in $(dirname "$file")"
          cd "$(dirname "$file")"
          kustomize build . > /dev/null
          cd - > /dev/null
        done

    - name: Setup kubeconform
      run: |
        curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
        sudo mv kubeconform /usr/local/bin

    - name: Validate with kubeconform
      run: |
        # Add custom schema locations for CRDs
        find k8s/ -name '*.yaml' -o -name '*.yml' | xargs kubeconform \
          -strict \
          -verbose \
          -schema-location default \
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
          -skip 'IngressRoute,IngressRouteTCP,IngressRouteUDP,Middleware,TLSOption,GitRepository,Kustomization,HelmRepository,HelmRelease,Alert,Provider,Receiver,Certificate,ClusterIssuer,Issuer' \
          -ignore-missing-schemas

    - name: Setup Polaris
      run: |
        curl -L https://github.com/FairwindsOps/polaris/releases/download/v10.2.5/polaris_10.2.5_linux_amd64.tar.gz | tar xz
        sudo mv polaris /usr/local/bin

    - name: Run Polaris audit
      run: |
        # Create a temporary config to run Polaris on files
        find k8s/ -name '*.yaml' -o -name '*.yml' | xargs polaris audit --audit-path

    - name: Setup YAML Lint
      run: |
        pip install yamllint

    - name: Lint YAML files
      run: |
        yamllint k8s/ || true  # Non-blocking for now, just informational

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: 'k8s/'
        format: 'sarif'
        output: 'trivy-results.sarif'
