apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - https://github.com/fluxcd/image-reflector-controller/releases/download/v1.2.5/image-reflector-controller.deployment.yaml
  - https://github.com/fluxcd/image-automation-controller/releases/download/v1.2.5/image-automation-controller.deployment.yaml
patches:
  - target:
      kind: Deployment
      name: image-reflector-controller
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: image-reflector-controller
  - target:
      kind: Deployment
      name: image-automation-controller
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: image-automation-controller
