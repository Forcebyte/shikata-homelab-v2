apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backrest-config
  namespace: backup
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backrest
  namespace: backup
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backrest
  template:
    metadata:
      labels:
        app: backrest
    spec:
      automountServiceAccountToken: false
      containers:
      - name: backrest
        image: garethgeorge/backrest:v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215 # {"$imagepolicy": "flux-system:backrest"}
        ports:
        - containerPort: 9898
          name: http
        env:
        - name: BACKREST_DATA
          value: /data
        - name: BACKREST_CONFIG
          value: /config/config.json
        - name: XDG_CACHE_HOME
          value: /cache
        - name: TZ
          value: America/Toronto
        - name: BACKREST_PORT
          value: ":9898"
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
            add:
            - DAC_READ_SEARCH
            - DAC_OVERRIDE
        volumeMounts:
        - name: config
          mountPath: /config
        - name: config
          mountPath: /data
          subPath: data
        - name: cache
          mountPath: /cache
        - name: pvdata
          mountPath: /pvdata
          readOnly: true
        - name: mysqlfs
          mountPath: /mnt/mysqlfs
        - name: tmp
          mountPath: /tmp
        - name: b2
          mountPath: /mnt/b2
        - name: oci-bucket
          mountPath: /mnt/oci-bucket
        - name: b2-2
          mountPath: /mnt/b2-2
        - name: k3s-server
          mountPath: /host-k3s/server
          readOnly: true
        - name: rancher-config
          mountPath: /host-k3s/etc-rancher
          readOnly: true
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: backrest-config
      - name: cache
        emptyDir: {}
      - name: pvdata
        hostPath:
          path: /var/lib/rancher/k3s/storage
          type: Directory
      - name: mysqlfs
        hostPath:
          path: /mnt/mysqlfs
          type: Directory
      - name: tmp
        emptyDir: {}
      - name: b2
        hostPath:
          path: /mnt/b2
          type: Directory
      - name: oci-bucket
        hostPath:
          path: /mnt/oci-bucket
          type: Directory
      - name: b2-2
        hostPath:
          path: /mnt/b2-2
          type: Directory
      - name: k3s-server
        hostPath:
          path: /var/lib/rancher/k3s/server
          type: Directory
      - name: rancher-config
        hostPath:
          path: /etc/rancher
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: backrest
  namespace: backup
spec:
  selector:
    app: backrest
  ports:
  - name: http
    port: 9898
    targetPort: 9898
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backrest
  namespace: backup
  annotations:
    external-dns.kubernetes.io/target: "140.238.159.81"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`backrest.forcebyte.org`)
    middlewares:
    - name: umami
      namespace: kube-system
    services:
    - name: backrest
      port: 9898
