apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-latest
  namespace: rollout-latest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollout-latest
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollout-latest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollout-latest
subjects:
  - kind: ServiceAccount
    name: rollout-latest
    namespace: rollout-latest