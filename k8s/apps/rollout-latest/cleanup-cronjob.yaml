apiVersion: batch/v1
kind: CronJob
metadata:
  name: rollout-latest-pod-cleanup
  namespace: rollout-latest
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: rollout-latest
          restartPolicy: Never
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -ceu
                - |
                  pods=$(kubectl get pods -n rollout-latest -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.reason}{"|"}{.status.containerStatuses[*].state.waiting.reason}{"|"}{.status.containerStatuses[*].state.terminated.reason}{"\n"}{end}')

                  while IFS='|' read -r name pod_reason waiting_reasons terminated_reasons; do
                    [[ -z "$name" ]] && continue

                    if [[ "$pod_reason" == "Evicted" ]] || [[ "$waiting_reasons $terminated_reasons" == *ContainerStatusUnknown* ]]; then
                      echo "Deleting pod ${name} reason=${pod_reason} waiting=${waiting_reasons} terminated=${terminated_reasons}"
                      kubectl delete pod "$name" -n rollout-latest --ignore-not-found --wait=false
                    fi
                  done <<< "$pods"