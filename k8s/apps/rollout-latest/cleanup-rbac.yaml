apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-latest-pod-cleanup
  namespace: rollout-latest
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-latest-pod-cleanup
  namespace: rollout-latest
subjects:
  - kind: ServiceAccount
    name: rollout-latest
    namespace: rollout-latest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollout-latest-pod-cleanup