# PersistentVolumeClaim for Calibre-Web data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-data
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi  # Adjust storage size as needed
  storageClassName: local-path
---
# PersistentVolumeClaim for Calibre library
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-library
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi  # Adjust storage size as needed for your eBooks
  storageClassName: local-path
---
# Deployment for Calibre-Web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
    spec:
      containers:
        - name: calibre-web
          image: linuxserver/calibre-web:0.6.24
          ports:
            - containerPort: 8083  # Default port for Calibre-Web
            - containerPort: 8089  # Kobo Port
          volumeMounts:
            - name: calibre-web-data
              mountPath: /config  # Configuration and database files
            - name: calibre-library
              mountPath: /books  # Path to your eBook library
            - name: qbittorrent-downloads
              mountPath: /downloads # Path to your download folder
          env:
            - name: PUID
              value: "1000"  # Adjust to match your user ID
            - name: PGID
              value: "1000"  # Adjust to match your group ID
            - name: TZ
              value: "Etc/UTC"  # Set your timezone
      volumes:
        - name: calibre-web-data
          persistentVolumeClaim:
            claimName: calibre-web-data
        - name: calibre-library
          persistentVolumeClaim:
            claimName: calibre-library
        - name: qbittorrent-downloads
          persistentVolumeClaim:
            claimName: qbittorrent-downloads
---
# Deployment for Calibre
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre
  namespace: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calibre
  template:
    metadata:
      labels:
        app: calibre
    spec:
      containers:
        - name: calibre
          image: linuxserver/calibre:latest
          ports:
            - containerPort: 8080  # Default port for Calibre
            - containerPort: 8081  # Calibre Content-Server Port
          volumeMounts:
            - name: calibre-config
              mountPath: /config  # Configuration files
            - name: calibre-library
              mountPath: /books  # Path to your eBook library
            - name: qbittorrent-downloads
              mountPath: /downloads # Path to your download folder
          env:
            - name: PUID
              value: "1000"  # Adjust to match your user ID
            - name: PGID
              value: "1000"  # Adjust to match your group ID
            - name: TZ
              value: "Etc/UTC"  # Set your timezone
      volumes:
        - name: calibre-config
          persistentVolumeClaim:
            claimName: calibre-web-data
        - name: calibre-library
          persistentVolumeClaim:
            claimName: calibre-library
        - name: qbittorrent-downloads
          persistentVolumeClaim:
            claimName: qbittorrent-downloads
---
# Service for Calibre-Web
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  namespace: qbittorrent
spec:
  selector:
    app: calibre-web
  ports:
    - name: http
      port: 80
      targetPort: 8083
    - name: kobo
      port: 8089
      targetPort: 8089
  type: ClusterIP
---
# Service for Calibre
apiVersion: v1
kind: Service
metadata:
  name: calibre
  namespace: qbittorrent
spec:
  selector:
    app: calibre
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: server
      port: 8081
      targetPort: 8081
  type: ClusterIP
---
# IngressRoute for Calibre-Web
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre-web
  namespace: qbittorrent
  annotations:
    external-dns.alpha.kubernetes.io/target: calibre.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`calibre.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: github-oauth  # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: calibre-web
          port: 80
---
# IngressRoute for Calibre-Web
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre-web-kobo
  namespace: qbittorrent
  annotations:
    external-dns.alpha.kubernetes.io/target: calibre-kobo.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    # This CANNOT use a middleware, as it will not work with kobo devices to access the content server
    - match: Host(`calibre-kobo.forcebyte.org`)
      kind: Rule
      services:
        - name: calibre-web
          port: 8081
---
# IngressRoute for Calibre with GitHub OAuth
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre
  namespace: qbittorrent
  annotations:
    external-dns.alpha.kubernetes.io/target: calibre-reader.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`calibre-reader.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: github-oauth  # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: calibre
          port: 8080
---
# IngressRoute for Calibre with GitHub OAuth
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre-server
  namespace: qbittorrent
  annotations:
    external-dns.alpha.kubernetes.io/target: calibre-server.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`calibre-server.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: github-oauth  # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: calibre
          port: 8081
