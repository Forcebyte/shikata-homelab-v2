apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-data
  namespace: calibre-web
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi  # Adjust storage size as needed
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
    spec:
      containers:
        - name: calibre-web
          image: linuxserver/calibre-web:latest
          ports:
            - containerPort: 8083  # Default port for Calibre-Web
          volumeMounts:
            - name: calibre-web-data
              mountPath: /config  # Configuration and database files
            - name: calibre-library
              mountPath: /books  # Path to your eBook library
          env:
            - name: PUID
              value: "1000"  # Adjust to match your user ID
            - name: PGID
              value: "1000"  # Adjust to match your group ID
            - name: TZ
              value: "Etc/UTC"  # Set your timezone
      volumes:
        - name: calibre-web-data
          persistentVolumeClaim:
            claimName: calibre-web-data
        - name: calibre-library
          hostPath:
            path: /path/to/your/ebooks  # Replace with the path to your eBook library
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  selector:
    app: calibre-web
  ports:
    - name: http
      port: 80
      targetPort: 8083
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre-web
  namespace: calibre-web
  annotations:
    external-dns.alpha.kubernetes.io/target: calibre.forcebyte.org
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`calibre.forcebyte.org`)
      kind: Rule
      services:
        - name: calibre-web
          port: 80
  tls:
    certResolver: cloudflare