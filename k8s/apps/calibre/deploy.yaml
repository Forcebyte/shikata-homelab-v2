# PersistentVolumeClaim for Calibre-Web data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-data
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi # Adjust storage size as needed
  storageClassName: local-path
---
# PersistentVolumeClaim for Calibre library
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-library
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi # Adjust storage size as needed for your eBooks
  storageClassName: local-path
---
# Deployment for Calibre-Web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: qbittorrent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: calibre-web
          image: linuxserver/calibre-web:latest@sha256:470b4ed9a7d6ea1475fef17dbcf957cb60880910296d226bd0dca652c05f68ca # {"$imagepolicy": "flux-system:calibre-web"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8083 # Default port for Calibre-Web
          resources:
            limits:
              memory: "384Mi"
          #resources:
          #  limits:
          #    memory: "1Gi"
          #    cpu: "500m"
          volumeMounts:
            - name: calibre-web-data
              mountPath: /config # Configuration and database files
            - name: calibre-library
              mountPath: /books # Path to your eBook library
            - name: qbittorrent-downloads
              mountPath: /downloads # Path to your download folder
            - name: custom-files
              mountPath: /custom-files
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - >
                    cp /custom-files/kobo.py /app/calibre-web/cps/kobo.py && cp /custom-files/kobo_auth.py /app/calibre-web/cps/kobo_auth.py && cp /custom-files/kobo_sync_status.py /app/calibre-web/cps/kobo_sync_status.py

          env:
            - name: PUID
              value: "1000" # Adjust to match your user ID
            - name: PGID
              value: "1000" # Adjust to match your group ID
            - name: TZ
              value: "Etc/UTC" # Set your timezone
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: calibre-web-data
          persistentVolumeClaim:
            claimName: calibre-web-data
        - name: calibre-library
          persistentVolumeClaim:
            claimName: calibre-library
        - name: qbittorrent-downloads
          persistentVolumeClaim:
            claimName: qbittorrent-downloads
        - name: custom-files
          configMap:
            name: calibre-web-custom-files
---
# Deployment for Calibre
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre
  namespace: qbittorrent
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: calibre
  template:
    metadata:
      labels:
        app: calibre
    spec:
      automountServiceAccountToken: false
      containers:
        - name: calibre
          image: linuxserver/calibre:latest@sha256:1223ffddba4ae6faedbd029bcfaa27c43eeb6d172e34c7fac5e0fd5bbad27bf3 # {"$imagepolicy": "flux-system:calibre"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080 # Default port for Calibre
          resources:
            requests:
              memory: "450Mi"
            limits:
              memory: "768Mi"
          volumeMounts:
            - name: calibre-config
              mountPath: /config # Configuration files
            - name: calibre-library
              mountPath: /books # Path to your eBook library
            - name: qbittorrent-downloads
              mountPath: /downloads # Path to your download folder
          env:
            - name: PUID
              value: "1000" # Adjust to match your user ID
            - name: PGID
              value: "1000" # Adjust to match your group ID
            - name: TZ
              value: "Etc/UTC" # Set your timezone
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: calibre-config
          persistentVolumeClaim:
            claimName: calibre-web-data
        - name: calibre-library
          persistentVolumeClaim:
            claimName: calibre-library
        - name: qbittorrent-downloads
          persistentVolumeClaim:
            claimName: qbittorrent-downloads
---
# Service for Calibre-Web
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  namespace: qbittorrent
spec:
  selector:
    app: calibre-web
  ports:
    - name: http
      port: 80
      targetPort: 8083
  type: ClusterIP
---
# Service for Calibre
apiVersion: v1
kind: Service
metadata:
  name: calibre
  namespace: qbittorrent
spec:
  selector:
    app: calibre
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: server
      port: 8081
      targetPort: 8081
  type: ClusterIP
---
# IngressRoute for Calibre-Web
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre-web
  namespace: qbittorrent
  annotations:
    external-dns.kubernetes.io/target: "140.238.159.81"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # This CANNOT use a middleware, as it will not work with kobo devices to access the content server
    - match: Host(`calibre.forcebyte.org`)
      kind: Rule
      services:
        - name: calibre-web
          port: 80
---
# IngressRoute for Calibre with GitHub OAuth
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre
  namespace: qbittorrent
  annotations:
    external-dns.kubernetes.io/target: calibre-reader.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`calibre-reader.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: github-oauth # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: calibre
          port: 8080
---
# IngressRoute for Calibre with GitHub OAuth
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre-server
  namespace: qbittorrent
  annotations:
    external-dns.kubernetes.io/target: calibre-server.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`calibre-server.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: github-oauth # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: calibre
          port: 8081
