apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-world
  namespace: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 18Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest@sha256:0f3d1571b7d7bf237c08cbe5ee33cfd67e16bd66f454259ed0a2e35f1e2a2e70 # {"$imagepolicy": "flux-system:minecraft"}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "600Mi"
            limits:
              memory: "1.5Gi"
          ports:
            - containerPort: 25565 # Minecraft server port
          env:
            - name: EULA
              value: "TRUE"
            - name: TZ
              value: "Etc/UTC"
            - name: INIT_MEMORY
              value: "256M"
            - name: MAX_MEMORY
              value: "1G"
          # resources:
          #   limits:
          #     memory: "1Gi"
          #     cpu: "500m"
          volumeMounts:
            - name: minecraft-world
              mountPath: /data # Minecraft world data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: minecraft-world
          persistentVolumeClaim:
            claimName: minecraft-world
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
spec:
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: minecraft
  namespace: minecraft
  annotations:
    external-dns.kubernetes.io/target: minecraft.forcebyte.org
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - minecraft
  routes:
    - match: HostSNI(`*`)
      services:
        - name: minecraft
          port: 25565
