# Exported from the live cluster on 2026-10-20 (previously kubectl-only,
# never committed). The three custom local-path provisioners (B2, mysqlfs,
# OCI) share the ServiceAccount/RBAC (local-path-provisioner-service-account)
# that ships with k3s's built-in local-path provisioner, so those are
# intentionally NOT redefined here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner-b2
  namespace: kube-system
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: local-path-provisioner-b2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: local-path-provisioner-b2
    spec:
      containers:
      - command:
        - local-path-provisioner
        - start
        - --config
        - /etc/config/config.json
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: CONFIGMAP_NAME
          value: local-path-config-b2
        - name: PROVISIONER_NAME
          value: rancher.io/local-path-b2
        image: rancher/local-path-provisioner:v0.0.36
        imagePullPolicy: IfNotPresent
        name: local-path-provisioner-b2
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/config/
          name: config-volume
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: local-path-provisioner-service-account
      serviceAccountName: local-path-provisioner-service-account
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - configMap:
          defaultMode: 420
          name: local-path-config-b2
        name: config-volume
---
