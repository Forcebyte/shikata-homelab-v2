# Exported from the live cluster on 2026-10-20 (previously kubectl-only,
# never committed). The three custom local-path provisioners (B2, mysqlfs,
# OCI) share the ServiceAccount/RBAC (local-path-provisioner-service-account)
# that ships with k3s's built-in local-path provisioner, so those are
# intentionally NOT redefined here.
apiVersion: v1
data:
  config.json: |
    {
      "nodePathMap":[
      {
        "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
        "paths":["/mnt/b2/k8s"]
      }
      ]
    }
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: "rancher/mirrored-library-busybox:1.37.0"
        imagePullPolicy: IfNotPresent
  setup: |
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "${VOL_DIR}"
    chmod 700 "${VOL_DIR}/.."
  teardown: |
    #!/bin/sh
    set -eu
    rm -rf "${VOL_DIR}"
kind: ConfigMap
metadata:
  name: local-path-config-b2
  namespace: kube-system
