apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-filestash
  namespace: filestash
  annotations:
    external-dns.alpha.kubernetes.io/target: filestash.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`filestash.forcebyte.org`)
      kind: Rule
      services:
        - name: filestash
          port: 8334
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: github-oauth
          namespace: kube-system
