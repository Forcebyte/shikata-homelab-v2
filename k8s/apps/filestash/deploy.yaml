apiVersion: apps/v1
kind: Deployment
metadata:
  name: filestash
  namespace: filestash
spec:
  replicas: 0
  selector:
    matchLabels:
      app: filestash
  template:
    metadata:
      labels:
        app: filestash
    spec:
      containers:
        - name: app
          image: machines/filestash:latest
          env:
            - name: APPLICATION_URL
              value: ""
            - name: CANARY
              value: "true"
            - name: OFFICE_URL
              value: "http://wopi-server:9980"
            - name: OFFICE_FILESTASH_URL
              value: "http://app:8334"
            - name: OFFICE_REWRITE_URL
              value: "http://127.0.0.1:9980"
          ports:
            - containerPort: 8334
          resources:
            requests:
              memory: "192Mi"
              cpu: "75m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: filestash-data
              mountPath: /app/data/state/
        - name: wopi-server
          image: collabora/code:24.04.10.2.1
          env:
            - name: extra_params
              value: "--o:ssl.enable=false"
            - name: aliasgroup1
              value: "https://.*:443"
          command: ["/bin/bash", "-c"]
          args:
            - |
              curl -o /usr/share/coolwsd/browser/dist/branding-desktop.css https://gist.githubusercontent.com/mickael-kerjean/bc1f57cd312cf04731d30185cc4e7ba2/raw/d706dcdf23c21441e5af289d871b33defc2770ea/destop.css
              /bin/su -s /bin/bash -c '/start-collabora-online.sh' cool
          ports:
            - containerPort: 9980
          resources:
            requests:
              memory: "384Mi"
              cpu: "188m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          securityContext:
            runAsUser: 0
      volumes:
        - name: filestash-data
          persistentVolumeClaim:
            claimName: filestash-data
