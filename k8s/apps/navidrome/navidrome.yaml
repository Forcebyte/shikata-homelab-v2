apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      automountServiceAccountToken: false
      containers:
        - name: navidrome
          image: deluan/navidrome:latest@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52 # {"$imagepolicy": "flux-system:navidrome"}
          imagePullPolicy: Always
          ports:
            - containerPort: 4533
          env:
            - name: ND_MUSICFOLDER
              value: "/music"
            - name: ND_DATAFOLDER
              value: "/data"
            - name: ND_LOGLEVEL
              value: "info"
            - name: TZ
              value: "Etc/UTC"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: navidrome-data
              mountPath: /data
            - name: music
              mountPath: /music
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: navidrome-data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          persistentVolumeClaim:
            claimName: music
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: qbittorrent
spec:
  selector:
    app: navidrome
  ports:
    - name: http
      port: 80
      targetPort: 4533
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: navidrome
  namespace: qbittorrent
  annotations:
    external-dns.kubernetes.io/target: "140.238.159.81"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`navidrome.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: umami
          namespace: kube-system
      services:
        - name: navidrome
          port: 80
