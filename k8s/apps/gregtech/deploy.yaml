apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gregtech-world
  namespace: gregtech
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gregtech
  namespace: gregtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gregtech
  template:
    metadata:
      labels:
        app: gregtech
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gregtech
          image: itzg/minecraft-server:java25
          imagePullPolicy: Always
          ports:
            - containerPort: 25565
          env:
            - name: EULA
              value: "TRUE"
            - name: TZ
              value: "Etc/UTC"
            - name: TYPE
              value: "GTNH"
            - name: GTNH_PACK_VERSION
              value: "2.9.0-RC-2"
            - name: INIT_MEMORY
              value: "6G"
            - name: MAX_MEMORY
              value: "6G"
            - name: JVM_OPTS
              value: "-XX:+UseZGC -XX:+ZGenerational -XX:+UseCompactObjectHeaders"
            - name: VIEW_DISTANCE
              value: "8"
          #resources:
          #  limits:
          #    memory: "4Gi"
          #    cpu: "1000m"
          volumeMounts:
            - name: gregtech-world
              mountPath: /data
          resources:
            requests:
              memory: "2560Mi"
            limits:
              memory: "7Gi"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: gregtech-world
          persistentVolumeClaim:
            claimName: gregtech-world
---
apiVersion: v1
kind: Service
metadata:
  name: gregtech
  namespace: gregtech
spec:
  selector:
    app: gregtech
  ports:
    - name: gregtech
      port: 25567
      targetPort: 25565
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gregtech
  namespace: gregtech
  annotations:
    external-dns.kubernetes.io/target: gregtech.forcebyte.org
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - minecraft-gregtech
  routes:
    - match: HostSNI(`*`)
      services:
        - name: gregtech
          port: 25567
