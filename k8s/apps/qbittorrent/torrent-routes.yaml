apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: qbittorrent-torrent-tcp
  namespace: qbittorrent
spec:
  entryPoints:
    - bittorrenttcp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: qbittorrent
          port: 49155
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: qbittorrent-torrent-udp
  namespace: qbittorrent
spec:
  entryPoints:
    - bittorrentudp
  routes:
    - services:
        - name: qbittorrent
          port: 49155
