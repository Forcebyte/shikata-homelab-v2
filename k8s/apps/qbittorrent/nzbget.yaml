apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nzbget-config
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi  # Adjust storage size as needed
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nzbget-downloads
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi  # Adjust storage size as needed
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  namespace: qbittorrent
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nzbget
  template:
    metadata:
      labels:
        app: nzbget
    spec:
      containers:
        - name: nzbget
          image: lscr.io/linuxserver/nzbget:latest
          ports:
            - containerPort: 6789  # Web UI port
          volumeMounts:
            - name: nzbget-config
              mountPath: /config  # Configuration files
            - name: nzbget-downloads
              mountPath: /downloads  # Downloads directory
          env:
            - name: PUID
              value: "1000"  # Adjust to match your user ID
            - name: PGID
              value: "1000"  # Adjust to match your group ID
            - name: TZ
              value: "Etc/UTC"  # Set your timezone
      volumes:
        - name: nzbget-config
          persistentVolumeClaim:
            claimName: nzbget-config
        - name: nzbget-downloads
          persistentVolumeClaim:
            claimName: nzbget-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: nzbget
  namespace: qbittorrent
spec:
  selector:
    app: nzbget
  ports:
    - name: webui
      port: 6789
      targetPort: 6789
  type: ClusterIP
---
apiVersion: traefik.io/v1
kind: IngressRoute
metadata:
  name: nzbget
  namespace: qbittorrent
  annotations:
    # external-dns.alpha.kubernetes.io/target: nzbget.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nzbget.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: github-oauth  # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: nzbget
          port: 6789