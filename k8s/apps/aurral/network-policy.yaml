apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aurral
  namespace: qbittorrent
spec:
  podSelector:
    matchLabels:
      app: aurral
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow Lidarr API (same namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qbittorrent
          podSelector:
            matchLabels:
              app: lidarr
      ports:
        - protocol: TCP
          port: 8686
    # Allow Navidrome API (same namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qbittorrent
          podSelector:
            matchLabels:
              app: navidrome
      ports:
        - protocol: TCP
          port: 4533
    # Allow external HTTPS egress (ListenBrainz/Last.fm/MusicBrainz)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
