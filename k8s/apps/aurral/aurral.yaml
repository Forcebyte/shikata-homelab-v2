apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aurral-config
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurral
  namespace: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aurral
  template:
    metadata:
      labels:
        app: aurral
    spec:
      automountServiceAccountToken: false
      containers:
        - name: aurral
          image: ghcr.io/lklynet/aurral:latest@sha256:a772c2d6c35dd9dd90128cf350bfc35b37bdd3c59ab5810374b7aa1a4063855c # {"$imagepolicy": "flux-system:aurral"}
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: aurral-config
              mountPath: /config
            - name: music
              mountPath: /data/music
            - name: downloads
              mountPath: /data/downloads
            - name: slskd-downloads
              mountPath: /data/slskd-downloads
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: aurral-config
          persistentVolumeClaim:
            claimName: aurral-config
        - name: music
          persistentVolumeClaim:
            claimName: music
        - name: downloads
          persistentVolumeClaim:
            claimName: qbittorrent-downloads
        - name: slskd-downloads
          persistentVolumeClaim:
            claimName: slskd-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: aurral
  namespace: qbittorrent
spec:
  selector:
    app: aurral
  ports:
    - name: http
      port: 80
      targetPort: 3001
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aurral
  namespace: qbittorrent
  annotations:
    external-dns.kubernetes.io/target: "140.238.159.81"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`aurral.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: github-oauth
          namespace: kube-system
      services:
        - name: aurral
          port: 80
