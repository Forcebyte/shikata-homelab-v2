apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-nextcloud
  namespace: nextcloud
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: nextcloud.forcebyte.org
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nextcloud.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: nextcloud
          port: 8080
