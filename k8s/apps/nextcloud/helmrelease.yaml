apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 15m
  chart:
    spec:
      chart: nextcloud
      version: 8.5.2
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      flavor: apache
    nextcloud:
      host: nextcloud.kube.home
      username: admin
      password: ***REMOVED***
    externalDatabase:
      enabled: true
      type: mysql
      host: 10.0.1.170:3306
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-mysql
        usernameKey: db-username
        passwordKey: db-password
    persistence:
      enabled: false
    cronjob:
      enabled: true
      type: cronjob
    ingress:
      enabled: false
    metrics:
      enabled: false
