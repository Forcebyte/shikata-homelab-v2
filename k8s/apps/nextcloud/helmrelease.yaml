apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 15m
  chart:
    spec:
      chart: nextcloud
      version: 8.5.2
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      flavor: apache
    nextcloud:
      host: nextcloud.forcebyte.org
      trustedDomains:
        - nextcloud.forcebyte.org
      username: admin
      password: ***REMOVED***
      extraEnv:
        - name: NEXTCLOUD_DB_TYPE
          value: mysql
        - name: MYSQL_HOST
          value: 10.0.1.170
        - name: MYSQL_PORT
          value: "3306"
        - name: MYSQL_DATABASE
          value: nextcloud
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: nextcloud-mysql
              key: db-username
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-mysql
              key: db-password
    externalDatabase:
      enabled: true
      type: mysql
      host: 10.0.1.170:3306
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-mysql
        usernameKey: db-username
        passwordKey: db-password
    internalDatabase:
      enabled: false
    persistence:
      enabled: false
    cronjob:
      enabled: true
      type: cronjob
    ingress:
      enabled: false
    metrics:
      enabled: false
