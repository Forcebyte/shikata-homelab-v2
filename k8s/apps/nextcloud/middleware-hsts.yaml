apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts-headers
  namespace: nextcloud
spec:
  headers:
    stsSeconds: 15768000
    stsIncludeSubdomains: true
    stsPreload: true
    customRequestHeaders:
      X-Frame-Options: "SAMEORIGIN"
      X-Content-Type-Options: "nosniff"
      Referrer-Policy: "no-referrer"
      X-XSS-Protection: "1; mode=block"
