apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-oauth-server
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-oauth-server
  template:
    metadata:
      labels:
        app: github-oauth-server
    spec:
      automountServiceAccountToken: false
      containers:
        - name: github-oauth-server
          image: muxiu1997/traefik-github-oauth-server:latest@sha256:2f58ff3afb0394574d594e4516f7446afd80face426c2b74d2e98128f89ecd67 # {"$imagepolicy": "flux-system:github-oauth"}
          env:
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-oauth-secret
                  key: clientId
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-oauth-secret
                  key: clientSecret
            - name: API_BASE_URL
              value: "https://github-oauth.forcebyte.org/"
            - name: DEBUG_MODE
              value: "true"
          ports:
            - containerPort: 80
          #resources:
          #  limits:
          #    memory: "64Mi"
          #    cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: github-oauth-server
  namespace: kube-system
spec:
  selector:
    app: github-oauth-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: github-oauth-server
  namespace: kube-system
  annotations:
    external-dns.kubernetes.io/target: "140.238.159.81"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`github-oauth.forcebyte.org`) # Replace with your domain
      kind: Rule
      services:
        - name: github-oauth-server
          port: 80
---
# Middleware for GitHub OAuth
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: github-oauth
  namespace: kube-system
spec:
  plugin:
    github-oauth:
      logLevel: info
      apiBaseUrl: "https://github-oauth.forcebyte.org"
      whitelist:
        logins:
          - "Forcebyte" # Replace with your GitHub username
---
# Middleware for Rybbit
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rybbit
  namespace: kube-system
spec:
  plugin:
    rewrite-body:
      rewrites:
        - regex: </head>
          replacement: <script defer data-site-id="199e17f0f389" src="https://rybbit.forcebyte.org/api/script.js"></script></head>
