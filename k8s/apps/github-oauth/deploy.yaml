apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-oauth-server
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-oauth-server
  template:
    metadata:
      labels:
        app: github-oauth-server
    spec:
      containers:
        - name: github-oauth-server
          image: muxiu1997/traefik-github-oauth-server:latest
          env:
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-oauth-secret
                  key: clientId
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-oauth-secret
                  key: clientSecret
            - name: API_BASE_URL
              value: "http://github-oauth-server.kube-system.svc.cluster.local"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: github-oauth-server
  namespace: kube-system
spec:
  selector:
    app: github-oauth-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP