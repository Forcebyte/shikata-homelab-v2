apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkroom
  namespace: darkroom
spec:
  selector:
    matchLabels:
      app: darkroom
  template:
    metadata:
      labels:
        app: darkroom
    spec:
      containers:
      - image: dahuss/a-dark-room
        name: darkroom
        ports:
          - name: web
            containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: darkroom
  namespace: darkroom
spec:
  ports:
    - name: web
      port: 80
      targetPort: web
  selector:
    app: darkroom
---
apiVersion: networking.k8s.io/v1
kind: IngressRoute
metadata:
  name: traefik-ingress-darkroom
  namespace: darkroom
  annotations:
    external-dns.alpha.kubernetes.io/target: darkroom.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`darkroom.forcebyte.org`)
      kind: Rule
      services:
        - name: darkroom
          port: 80