apiVersion: v1
kind: ServiceAccount
metadata:
  name: gtnh-dashboard
  namespace: gtnh-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gtnh-dashboard
  namespace: gregtech
rules:
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gtnh-dashboard
  namespace: gregtech
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gtnh-dashboard
subjects:
  - kind: ServiceAccount
    name: gtnh-dashboard
    namespace: gtnh-dashboard
