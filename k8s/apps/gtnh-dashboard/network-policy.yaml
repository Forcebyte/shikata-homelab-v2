apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gtnh-dashboard
  namespace: gtnh-dashboard
spec:
  podSelector:
    matchLabels:
      app: gtnh-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow GTNH server (Minecraft ping + RCON)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gregtech
      ports:
        - protocol: TCP
          port: 25565
        - protocol: TCP
          port: 25567
        - protocol: TCP
          port: 25575
    # Allow external HTTPS egress (Kubernetes API server at 10.43.0.1:443)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
