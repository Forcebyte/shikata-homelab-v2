apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: uptime-kuma
  namespace: flux-system
spec:
  type: generic
  address: http://100.73.64.91:8091/flux-event
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: uptime-kuma-maintenance
  namespace: flux-system
spec:
  providerRef:
    name: uptime-kuma
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: "*"
