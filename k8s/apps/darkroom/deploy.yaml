apiVersion: v1
kind: Namespace
metadata:
  name: darkroom
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---

apiVersion: v1
kind: Service
metadata:
  name: darkroom
  namespace: darkroom
  labels:
    app.kubernetes.io/name: darkroom
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: darkroom
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkroom
  namespace: darkroom
  labels:
    app.kubernetes.io/name: darkroom
spec:
  replicas: 0
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: darkroom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: darkroom
    spec:
      automountServiceAccountToken: false
      containers:
        - name: darkroom
          # Custom-made image
          image: "ghcr.io/forcebyte/adarkroom:latest@sha256:0f117cd989ff36397eadc65142521b52bd9de2e4a7e9e0028fafbb6f4b7bf462" # {"$imagepolicy": "flux-system:darkroom"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          #resources:
          #  limits:
          #    memory: "64Mi"
          #    cpu: "100m"
          resources:
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-darkroom
  namespace: darkroom
  annotations:
    external-dns.kubernetes.io/target: "140.238.159.81"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`darkroom.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: umami
          namespace: kube-system
      services:
        - name: darkroom
          port: 80
