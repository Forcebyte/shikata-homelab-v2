apiVersion: v1
kind: Namespace
metadata:
  name: darkroom
---
apiVersion: v1
kind: Service
metadata:
  name: darkroom
  namespace: darkroom
  labels:
    app.kubernetes.io/name: darkroom
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: darkroom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkroom
  namespace: darkroom
  labels:
    app.kubernetes.io/name: darkroom
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: darkroom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: darkroom
    spec:
      containers:
        - name: darkroom
          # Custom-made image
          image: "ghcr.io/forcebyte/adarkroom:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-darkroom
  namespace: darkroom
  annotations:
    # external-dns annotation removed
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`darkroom.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
      services:
        - name: darkroom
          port: 80