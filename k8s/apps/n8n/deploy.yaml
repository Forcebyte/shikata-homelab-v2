apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 0
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      automountServiceAccountToken: false
      containers:
        - name: n8n
          image: n8nio/n8n:latest@sha256:942bc274709f27f99f7c6024a785d8e8f75ac06838cabcba448abb8d9127ec7b # {"$imagepolicy": "flux-system:n8n"}
          imagePullPolicy: Always
          ports:
            - containerPort: 5678
          env:
            - name: N8N_HOST
              value: "n8n.forcebyte.org"
            - name: N8N_PROTOCOL
              value: "https"
            - name: NODE_ENV
              value: "production"
            - name: WEBHOOK_URL
              value: "https://n8n.forcebyte.org/"
            - name: GENERIC_TIMEZONE
              value: "America/Toronto"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          # resources:

          #   limits:
          #     memory: "1Gi"
          #     cpu: "500m"
          resources:
            limits:
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
spec:
  selector:
    app: n8n
  ports:
    - name: web
      port: 5678
      targetPort: 5678
  type: ClusterIP
