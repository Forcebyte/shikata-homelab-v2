apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-flux-orchestrator
  namespace: flux-orchestrator
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.kubernetes.io/target: "140.238.159.81"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`flux.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: umami
          namespace: kube-system
        - name: github-oauth
          namespace: kube-system
      services:
      - name: flux-orchestrator
        port: 80
