apiVersion: v1
kind: Namespace
metadata:
  name: flux-orchestrator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-orchestrator
  namespace: flux-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-orchestrator
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["kustomize.toolkit.fluxcd.io"]
  resources: ["kustomizations"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: ["helmreleases"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["source.toolkit.fluxcd.io"]
  resources: ["gitrepositories", "helmrepositories", "buckets", "ocirepositories"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["notification.toolkit.fluxcd.io"]
  resources: ["alerts", "providers", "receivers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["image.toolkit.fluxcd.io"]
  resources: ["imagepolicies", "imagerepositories", "imageupdateautomations"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-orchestrator
subjects:
- kind: ServiceAccount
  name: flux-orchestrator
  namespace: flux-orchestrator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-orchestrator-config
  namespace: flux-orchestrator
data:
  DB_DRIVER: "mysql"
  DB_HOST: "10.0.1.170"
  DB_PORT: "3306"
  DB_NAME: "flux_orchestrator"
  PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-orchestrator
  namespace: flux-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flux-orchestrator
  template:
    metadata:
      labels:
        app: flux-orchestrator
    spec:
      serviceAccountName: flux-orchestrator
      containers:
      - name: flux-orchestrator
        image: ghcr.io/forcebyte/flux-orchestrator:pr-9
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DB_DRIVER
          valueFrom:
            configMapKeyRef:
              name: flux-orchestrator-config
              key: DB_DRIVER
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: flux-orchestrator-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: flux-orchestrator-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: flux-orchestrator-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: flux-orchestrator-db-external
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flux-orchestrator-db-external
              key: db-password
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: flux-orchestrator-config
              key: PORT
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: fernet-key
              key: key
        - name: SCRAPE_IN_CLUSTER
          value: "true"
        - name: IN_CLUSTER_NAME
          value: "shikata"
---
apiVersion: v1
kind: Service
metadata:
  name: flux-orchestrator
  namespace: flux-orchestrator
spec:
  selector:
    app: flux-orchestrator
  ports:
  - port: 80
    targetPort: 8080
