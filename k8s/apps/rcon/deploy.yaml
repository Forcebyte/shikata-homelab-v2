apiVersion: apps/v1
kind: Deployment
metadata:
  name: rcon-web-admin
  namespace: rcon
spec:
  selector:
    matchLabels:
      app: rcon-web-admin
  template:
    metadata:
      labels:
        app: rcon-web-admin
    spec:
      containers:
        - name: rcon-web-admin
          image: itzg/rcon:latest
          ports:
            - containerPort: 4326
            - containerPort: 4327
          env:
            - name: RWA_USERNAME
              value: "forcebyte"
            - name: RWA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rcon-secrets
                  key: rcon-password
            - name: RWA_ADMIN
              value: "false"
            - name: RWA_RCON_HOST
              value: "140.238.159.81"
            - name: RWA_RCON_PORT
              value: "27015"
            - name: RWA_GAME
              value: "csgo"
            - name: RWA_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rcon-secrets
                  key: rcon-password
---
apiVersion: v1
kind: Service
metadata:
  name: rcon-web-admin
  namespace: rcon
spec:
  selector:
    app: rcon-web-admin
  ports:
    - name: web
      port: 8080
      targetPort: 4326
    - name: rcon
      port: 4327
      targetPort: 4327
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rcon-web-admin
  namespace: rcon
  annotations:
    external-dns.alpha.kubernetes.io/target: rcon.forcebyte.org
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`rcon.forcebyte.org`)
      kind: Rule  
      services:
        - name: rcon-web-admin
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rcon-web-admin
  namespace: rcon
  annotations:
    external-dns.alpha.kubernetes.io/target: rcon2.forcebyte.org
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`rcon2.forcebyte.org`)
      kind: Rule  
      services:
        - name: rcon-web-admin
          port: 4327
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: rcon-web-admin
  namespace: rcon
  annotations:
    external-dns.alpha.kubernetes.io/target: rcon.forcebyte.org
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - rcontcp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: rcon-web-admin
          port: 4327