apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rcon
  namespace: rcon
spec:
  podSelector:
    matchLabels:
      app: rcon-web-admin
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4326
        - protocol: TCP
          port: 4327
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow RCON to the configured CS2 server (RWA_RCON_HOST/RWA_RCON_PORT)
    - to:
        - ipBlock:
            cidr: 140.238.159.81/32
      ports:
        - protocol: TCP
          port: 27015
