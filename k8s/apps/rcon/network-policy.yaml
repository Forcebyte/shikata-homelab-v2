apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rcon
  namespace: rcon
spec:
  podSelector:
    matchLabels:
      app: rcon-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4326
        - protocol: TCP
          port: 4327
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow RCON connections to game servers
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
