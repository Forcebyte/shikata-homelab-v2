apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireguard-config
  namespace: wireguard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: wireguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      automountServiceAccountToken: false
      containers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard:latest@sha256:e2f655e1956a6db476bc879bf721f3f8bfed49c6d8fbcf39495d7ecb991d8228 # {"$imagepolicy": "flux-system:wireguard"}
          imagePullPolicy: Always
          ports:
            - name: wireguard
              containerPort: 51820
              protocol: UDP
          resources:
            limits:
              memory: "128Mi"
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Etc/UTC
            - name: SERVERURL
              value: wireguard.forcebyte.org
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: "1"
            - name: PEERDNS
              value: auto
            - name: ALLOWEDIPS
              value: 0.0.0.0/0
            - name: LOG_CONFS
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: wireguard-config
              mountPath: /config
      volumes:
        - name: wireguard-config
          persistentVolumeClaim:
            claimName: wireguard-config
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard
  namespace: wireguard
spec:
  selector:
    app: wireguard
  ports:
    - name: wireguard
      port: 51820
      targetPort: 51820
      protocol: UDP
  type: ClusterIP
