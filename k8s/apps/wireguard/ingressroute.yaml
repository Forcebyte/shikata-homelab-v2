apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: wireguard
  namespace: wireguard
  annotations:
    external-dns.kubernetes.io/target: wireguard.forcebyte.org
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - wireguard
  routes:
    - services:
        - name: wireguard
          port: 51820