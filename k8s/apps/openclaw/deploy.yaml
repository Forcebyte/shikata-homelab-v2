apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 0
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      initContainers:
        - name: init-config
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              SRC="/config/openclaw.json"
              DST="/home/node/.openclaw/openclaw.json"
              HASHFILE="/home/node/.openclaw/.openclaw.json.sha256"
              BACKUP="/home/node/.openclaw/openclaw.json.bak"
              echo "Initializing configuration (sha256 sync)..."
              mkdir -p /home/node/.openclaw
              [ -f "$SRC" ] || { echo "ERROR: missing source config: $SRC" >&2; exit 1; }
              SRC_HASH="$(sha256sum "$SRC" | awk '{print $1}')"
              # Seed if destination is missing
              if [ ! -f "$DST" ]; then
                echo "Destination missing; copying config..."
                cp "$SRC" "$DST"
                echo "$SRC_HASH" > "$HASHFILE"
                echo "Config initialized"
                exit 0
              fi
              OLD_HASH=""
              [ -f "$HASHFILE" ] && OLD_HASH="$(cat "$HASHFILE" 2>/dev/null || true)"
              # Update if hashfile missing OR hash changed
              if [ -z "$OLD_HASH" ] || [ "$OLD_HASH" != "$SRC_HASH" ]; then
                echo "Config update needed (no hash or changed). Updating..."
                cp "$DST" "$BACKUP" || true
                cp "$SRC" "$DST"
                echo "$SRC_HASH" > "$HASHFILE"
                echo "Config updated"
              else
                echo "Config hash matches; skipping"
              fi
          volumeMounts:
            - name: openclaw-config
              mountPath: /config
            - name: openclaw-data
              mountPath: /home/node
              subPath: openclaw-home
        - name: onboarding
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/node/.openclaw/credentials
              MARKER_FILE="/home/node/.openclaw/.onboarded"
              if [ -f "$MARKER_FILE" ]; then
                echo "Onboarding marker exists, skipping"
                exit 0
              fi
              cmd='node dist/index.js onboard --non-interactive --accept-risk --skip-health --no-install-daemon'
              echo "Running: $cmd"
              eval "$cmd"
              echo "ok $(date 2>/dev/null || true)" > "$MARKER_FILE"
          env:
            # Add any required onboarding env vars here, e.g. API keys
          volumeMounts:
            - name: openclaw-data
              mountPath: /home/node
              subPath: openclaw-home
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18791
            - containerPort: 18789
          env:
            - name: DOMAIN
              value: "openclaw.forcebyte.org"
          resources:
            limits:
              memory: 8Gi
              cpu: 2000m
            requests:
              memory: 1Gi
              cpu: 500m
          volumeMounts:
            - name: openclaw-data
              mountPath: /data
            - name: openclaw-data
              mountPath: /home/node
              subPath: openclaw-home
      volumes:
        - name: openclaw-data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: openclaw-config
          configMap:
            name: openclaw-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  selector:
    app: openclaw
  ports:
    - name: openclaw-ui
      port: 18789
      targetPort: 18789
    - name: openclaw-api
      port: 18791
      targetPort: 18791
  type: ClusterIP
