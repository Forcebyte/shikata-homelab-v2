apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      initContainers:
        - name: onboarding
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/node/.openclaw/credentials
              MARKER_FILE="/home/node/.openclaw/.onboarded"
              if [ -f "$MARKER_FILE" ]; then
                echo "Onboarding marker exists, skipping"
                exit 0
              fi
              # Seed config if missing
              SRC="/config/openclaw.json"
              DST="/home/node/.openclaw/openclaw.json"
              if [ -f "$SRC" ] && [ ! -f "$DST" ]; then
                echo "Seeding config from $SRC to $DST"
                cp "$SRC" "$DST"
              fi
              cmd='node dist/index.js onboard --non-interactive --accept-risk --skip-health --no-install-daemon'
              echo "Running: $cmd"
              eval "$cmd"
              echo "ok $(date 2>/dev/null || true)" > "$MARKER_FILE"
          env:
            # Add any required onboarding env vars here, e.g. API keys
          volumeMounts:
            - name: openclaw-data
              mountPath: /home/node
              subPath: openclaw-home
            - name: openclaw-config
              mountPath: /config/openclaw.json
              subPath: openclaw.json
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DOMAIN
              value: "openclaw.forcebyte.org"
            - name: GATEWAY_MODE
              value: "local"
          resources:
            limits:
              memory: 4Gi
              cpu: 2000m
            requests:
              memory: 1Gi
              cpu: 500m
          volumeMounts:
            - name: openclaw-data
              mountPath: /data
            - name: openclaw-config
              mountPath: /config/openclaw.json
              subPath: openclaw.json
      volumes:
        - name: openclaw-data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: openclaw-config
          configMap:
            name: openclaw-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  selector:
    app: openclaw
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
