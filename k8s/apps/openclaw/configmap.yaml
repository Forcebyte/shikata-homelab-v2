apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "agents": {
        "defaults": {
          "model": {
            "primary": "anthropic/claude-opus-4-5",
            "fallbacks": ["anthropic/claude-sonnet-4-5"]
          },
          "maxConcurrent": 4,
          "sandbox": {"mode": "off"}
        },
        "list": [{"id": "main", "default": true}]
      },
      "auth": {
        "profiles": {
          "anthropic:default": {"mode": "token", "provider": "anthropic"}
        }
      },
      "gateway": {
        "mode": "local",
        "bind": "auto",
        "auth": {"mode": "token"},
        "controlUi": {"enabled": true}
      },
      "channels": {}
    }
