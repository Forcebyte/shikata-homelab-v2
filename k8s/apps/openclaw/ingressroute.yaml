apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openclaw-ingress
  namespace: openclaw
  annotations:
    external-dns.alpha.kubernetes.io/target: openclaw.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`openclaw.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: github-oauth
          namespace: kube-system
      services:
        - name: openclaw-ui
          port: 18791
    - match: Host(`openclaw.example.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: openclaw-api
          port: 18791