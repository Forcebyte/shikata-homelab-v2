apiVersion: traefik.io/v1
kind: IngressRoute
metadata:
  name: phpmyadmin
  namespace: phpmyadmin
  annotations:
    external-dns.alpha.kubernetes.io/target: phpmyadmin.forcebyte.org
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`phpmyadmin.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: github-oauth
          namespace: kube-system
      services:
        - name: phpmyadmin
          port: 8888
