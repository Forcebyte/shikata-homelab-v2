apiVersion: v1
kind: Namespace
metadata:
  name: phpmyadmin
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: phpmyadmin
spec:
  replicas: 0
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      automountServiceAccountToken: false
      containers:
      - name: phpmyadmin
        image: phpmyadmin:latest@sha256:62a50b1419fe55b9b4c3cd6f5aed03a18f8f5b4a236f24735d76400bea75a5ff # {"$imagepolicy": "flux-system:phpmyadmin"}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        #resources:
        #  limits:
        #    memory: "96Mi"
        #    cpu: "150m"
        env:
        - name: PMA_HOST
          value: "10.0.1.170"
        - name: PMA_PORT
          value: "3306"
        - name: PMA_USER
          valueFrom:
            secretKeyRef:
              name: flux-orchestrator-db-external
              key: db-username
        - name: PMA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flux-orchestrator-db-external
              key: db-password
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flux-orchestrator-db-external
              key: db-password
        resources:
          limits:
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
---

apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: phpmyadmin
spec:
  selector:
    app: phpmyadmin
  ports:
  - port: 8888
    targetPort: 80
