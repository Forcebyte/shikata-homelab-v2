apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cs2-modded-claim
  namespace: game-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 60Gi #Reccomended Minimum
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs2-modded-server
  namespace: game-server
spec:
  replicas: 0
  selector:
    matchLabels:
      app: cs2-modded-server
  template:
    metadata:
      labels:
        app: cs2-modded-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: cs2-modded-server
          image: ghcr.io/kus/cs2-modded-server:latest@sha256:c7f06931e2e8100bd8d4d726f02a9470b3cc630eb68a4f38af149afbd69cb2f2 # {"$imagepolicy": "flux-system:cs2"}
          ports:
            - containerPort: 27015
              protocol: TCP
            - containerPort: 27015
              protocol: UDP
            - containerPort: 27020
              protocol: TCP
            - containerPort: 27020
              protocol: UDP
          env:
            - name: STEAM_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: cs2-secrets
                  key: steamAccount
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cs2-secrets
                  key: apiKey
          volumeMounts:
            - name: cs2-data
              mountPath: /home/steam/cs2
          resources:
            limits:
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: cs2-data
          persistentVolumeClaim:
            claimName: cs2-modded-claim
