apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: datadog
  namespace: flux-system
spec:
  interval: 30s 
  url: https://helm.datadoghq.com
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: datadog-agent
  namespace: datadog
spec:
  interval: 30s
  chart:
    spec:
      chart: datadog
      version: "3.x.x" # Use the latest stable version or pin as needed
      sourceRef:
        kind: HelmRepository
        name: datadog
        namespace: flux-system
  values:
    datadog:
      apiKeyExistingSecret: datadog-secret
      site: datadoghq.com
      logs:
        enabled: false
      apm:
        enabled: false
