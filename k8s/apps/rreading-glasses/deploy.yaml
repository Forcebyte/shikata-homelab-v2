apiVersion: apps/v1
kind: Deployment
metadata:
  name: rreading-glasses
  namespace: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rreading-glasses
  template:
    metadata:
      labels:
        app: rreading-glasses
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rreading-glasses
          image: blampe/rreading-glasses:hardcover@sha256:3f017a51d9007b715303a20f481c822e4df66485fc9e5f57f6fdf1de840dc02f # {"$imagepolicy": "flux-system:rreading-glasses"}
          command: ["/main"]
          args: ["serve", "--upstream=hardcover.app"]
          ports:
            - containerPort: 8788
          env:
            - name: POSTGRES_HOST
              value: "postgres.postgres.svc.cluster.local"
            - name: POSTGRES_DATABASE
              value: "rreading_glasses"
            - name: POSTGRES_USER
              value: "rreading_glasses"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rreading-glasses-db
                  key: password
            - name: HARDCOVER_AUTH
              valueFrom:
                secretKeyRef:
                  name: rreading-glasses
                  key: hardcover-auth
          resources:
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: rreading-glasses
  namespace: qbittorrent
spec:
  selector:
    app: rreading-glasses
  ports:
    - port: 8788
      targetPort: 8788
  type: ClusterIP
