apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hytale-data
  namespace: hytale
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hytale
  namespace: hytale
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hytale
  template:
    metadata:
      labels:
        app: hytale
    spec:
      containers:
        - name: hytale
          image: ghcr.io/forcebyte/hytale-server:latest-arm64
          imagePullPolicy: Always
          stdin: true
          tty: true
          ports:
            - containerPort: 5520
              protocol: UDP
          env:
            - name: JAVA_OPTS
              value: "-Xmx2G"
            - name: UPDATE_ON_STARTUP
              value: "true"
            - name: PATCHLINE
              value: "release"
          volumeMounts:
            - name: hytale-data
              mountPath: /data
      volumes:
        - name: hytale-data
          persistentVolumeClaim:
            claimName: hytale-data
---
apiVersion: v1
kind: Service
metadata:
  name: hytale
  namespace: hytale
spec:
  selector:
    app: hytale
  ports:
    - name: hytale-udp
      port: 5520
      targetPort: 5520
      protocol: UDP
  type: ClusterIP
