apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hytale-data
  namespace: hytale
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hytale-downloader
  namespace: hytale
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hytale
  namespace: hytale
spec:
  replicas: 0
  selector:
    matchLabels:
      app: hytale
  template:
    metadata:
      labels:
        app: hytale
    spec:
      containers:
        - name: hytale
          image: ghcr.io/forcebyte/hytale-server:latest-arm64
          imagePullPolicy: Always
          stdin: true
          tty: true
          ports:
            - containerPort: 5520
              protocol: UDP
          env:
            - name: JAVA_OPTS
              value: "-Xmx2G"
            - name: UPDATE_ON_STARTUP
              value: "true"
            - name: PATCHLINE
              value: "release"
          #resources:
          #  limits:
          #    memory: "2Gi"
          #    cpu: "1000m"
          volumeMounts:
            - name: hytale-data
              mountPath: /data
            - name: hytale-downloader
              mountPath: /downloader
          resources:
            limits:
              memory: "2Gi"
      volumes:
        - name: hytale-data
          persistentVolumeClaim:
            claimName: hytale-data
        - name: hytale-downloader
          persistentVolumeClaim:
            claimName: hytale-downloader
---
apiVersion: v1
kind: Service
metadata:
  name: hytale
  namespace: hytale
spec:
  selector:
    app: hytale
  ports:
    - name: hytale-udp
      port: 5520
      targetPort: 5520
      protocol: UDP
  type: ClusterIP
