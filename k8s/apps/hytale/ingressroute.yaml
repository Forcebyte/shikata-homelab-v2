apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: hytale
  namespace: hytale
  annotations:
    external-dns.kubernetes.io/target: hytale.forcebyte.org
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - hytale
  routes:
    - services:
        - name: hytale
          port: 5520
