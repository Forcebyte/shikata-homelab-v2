apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rybbit-postgres
  namespace: rybbit
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from backend
    - from:
        - podSelector:
            matchLabels:
              app: rybbit-backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qbittorrent
          podSelector:
            matchLabels:
              app: rreading-glasses
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: umami
          podSelector:
            matchLabels:
              app: umami
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
