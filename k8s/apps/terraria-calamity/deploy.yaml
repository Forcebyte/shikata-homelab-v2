apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: terraria-calamity-data
  namespace: terraria-calamity
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: terraria-calamity-mods
  namespace: terraria-calamity
data:
  install.txt: |
    2824688072
    2824688266
    2824688804
    2563309347
    2908170107
    2619954303
    2669644269
    2599842771
    2565639705
    2785100219

  enabled.json: |
    [
      "CalamityMod",
      "CalamityModMusic",
      "CalamityVanities",
      "MagicStorage",
      "SerousCommonLib",
      "RecipeBrowser",
      "BossChecklist",
      "AlchemistNPCLite",
      "OreExcavator",
      "SubworldLibrary"
    ]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraria-calamity
  namespace: terraria-calamity
spec:
  replicas: 0

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: terraria-calamity

  template:
    metadata:
      labels:
        app: terraria-calamity

    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        - name: configure-mods
          image: alpine:latest
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c
            - |
              set -e

              mkdir -p /data/Mods

              cp /config/install.txt /data/Mods/install.txt
              cp /config/enabled.json /data/Mods/enabled.json

              chown -R 1000:1000 /data
              chmod -R u+rwX /data

              echo "Mod configuration installed:"
              echo "--- install.txt ---"
              cat /data/Mods/install.txt
              echo "--- enabled.json ---"
              cat /data/Mods/enabled.json

          securityContext:
            runAsUser: 0
            runAsGroup: 0

          volumeMounts:
            - name: terraria-calamity-data
              mountPath: /data

            - name: terraria-calamity-mods
              mountPath: /config

      containers:
        - name: terraria-calamity
          image: ghcr.io/forcebyte/terraria-tmodloader-server-arm:latest # {"$imagepolicy": "flux-system:terraria-tmodloader"}
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000

          ports:
            - name: terraria
              containerPort: 7777
              protocol: TCP

          env:
            - name: WORLD
              value: /home/tml/.local/share/Terraria/tModLoader/Worlds/Calamity.wld

            - name: MAXPLAYERS
              value: "8"

            - name: PORT
              value: "7777"

            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: terraria-server-secret
                  key: password

            - name: MOTD
              value: "Welcome to the Calamity server!"

            - name: SECURE
              value: "0"

            - name: NPCSTREAM
              value: "1"

            - name: LANGUAGE
              value: "en/US"

          volumeMounts:
            - name: terraria-calamity-data
              mountPath: /home/tml/.local/share/Terraria/tModLoader

          resources:
            limits:
              memory: "1Gi"
      volumes:
        - name: terraria-calamity-data
          persistentVolumeClaim:
            claimName: terraria-calamity-data

        - name: terraria-calamity-mods
          configMap:
            name: terraria-calamity-mods

---
apiVersion: v1
kind: Service
metadata:
  name: terraria
  namespace: terraria-calamity
spec:
  selector:
    app: terraria-calamity

  ports:
    - name: terraria
      protocol: TCP
      port: 7778
      targetPort: 7777

  type: ClusterIP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: terraria
  namespace: terraria-calamity
  annotations:
    external-dns.kubernetes.io/target: terrariacalamity.forcebyte.org
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik

spec:
  entryPoints:
    - terrariacalamity
  routes:
    - match: HostSNI(`*`)
      services:
        - name: terraria
          port: 7778