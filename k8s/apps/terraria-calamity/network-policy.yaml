apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terraria
  namespace: terraria-calamity
spec:
  podSelector:
    matchLabels:
      app: terraria-calamity
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow game traffic from Traefik (TCP passthrough)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 7777
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow all other egress
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
