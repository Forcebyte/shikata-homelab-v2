apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readarr-data
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi  # Adjust storage size as needed
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readarr
  namespace: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readarr
  template:
    metadata:
      labels:
        app: readarr
    spec:
      containers:
        - name: readarr
          image: ghcr.io/pennydreadful/bookshelf:softcover
          ports:
            - containerPort: 8787  # Default port for Readarr
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: readarr-data
              mountPath: /config  # Configuration and database files
            - name: calibre-library
              mountPath: /books  # Path to your eBook library
            - name: qbittorrent-downloads
              mountPath: /downloads # Path to your download folder
          env:
            - name: PUID
              value: "1000"  # Adjust to match your user ID
            - name: PGID
              value: "1000"  # Adjust to match your group ID
            - name: TZ
              value: "Etc/UTC"  # Set your timezone
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: readarr-data
          persistentVolumeClaim:
            claimName: readarr-data
        - name: calibre-library
          persistentVolumeClaim:
            claimName: calibre-library
        - name: qbittorrent-downloads
          persistentVolumeClaim:
            claimName: qbittorrent-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: readarr
  namespace: qbittorrent
spec:
  selector:
    app: readarr
  ports:
    - name: http
      port: 80
      targetPort: 8787
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: readarr
  namespace: qbittorrent
  annotations:
    external-dns.kubernetes.io/target: "140.238.159.81"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`readarr.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: github-oauth  # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: readarr
          port: 80