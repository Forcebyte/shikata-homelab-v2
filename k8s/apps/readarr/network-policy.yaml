apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: readarr
  namespace: qbittorrent
spec:
  podSelector:
    matchLabels:
      app: readarr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8787
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow access to prowlarr
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prowlarr
      ports:
        - protocol: TCP
          port: 9696
    # Allow access to qbittorrent
    - to:
        - podSelector:
            matchLabels:
              app: qbittorrent
      ports:
        - protocol: TCP
          port: 8080
    # Allow all other egress (metadata, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
