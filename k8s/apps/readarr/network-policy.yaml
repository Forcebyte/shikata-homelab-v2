apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: readarr
  namespace: qbittorrent
spec:
  podSelector:
    matchLabels:
      app: readarr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8787
    # Allow from homepage
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
      ports:
        - protocol: TCP
          port: 8787
    # Allow from other apps in qbittorrent namespace (calibre, etc.)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8787
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow all apps in same namespace (calibre, qbittorrent, etc.)
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 6881
    # Allow access to prowlarr
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prowlarr
      ports:
        - protocol: TCP
          port: 9696
    # Allow all other egress (metadata, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
