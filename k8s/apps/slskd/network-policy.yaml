apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slskd
  namespace: qbittorrent
spec:
  podSelector:
    matchLabels:
      app: slskd
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 5030
    # Allow same-namespace peers (Soularr talks to the slskd API)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qbittorrent
      ports:
        - protocol: TCP
          port: 5030
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow all other egress (Soulseek server and peer connections)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
