apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-dns
  namespace: external-dns
spec:
  podSelector:
    matchLabels:
      app: external-dns
  policyTypes:
    - Ingress
    - Egress
  # No ingress: external-dns only makes outbound calls.
  ingress: []
  egress:
    # Broad egress: external-dns must reach the in-cluster apiserver
    # (ClusterIP 10.43.0.1:443) and the Cloudflare API. A port-443-only
    # rule does NOT match ClusterIP traffic on this CNI (verified
    # 2026-11-15: a labelled pod got curl exit 7 to the apiserver with
    # a 443-only rule, but connected fine with unrestricted egress),
    # so the port must not be restricted here.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
