apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-ftb-world-infinityevolved
  namespace: minecraft-ftb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-ftb
  namespace: minecraft-ftb
spec:
  replicas: 0
  selector:
    matchLabels:
      app: minecraft-ftb
  template:
    metadata:
      labels:
        app: minecraft-ftb
    spec:
      containers:
        - name: minecraft-ftb
          image: itzg/minecraft-server:java8
          imagePullPolicy: Always
          ports:
            - containerPort: 25565  # Internal container port
          env:
            - name: EULA
              value: "TRUE"
            - name: TZ
              value: "Etc/UTC"
            - name: TYPE
              value: "FTBA"
            - name: FTB_MODPACK_ID
              # Infinity evolved
              # See https://hub.docker.com/r/pvmjay/ftb-server for list of modpack IDs
              value: "23"
            - name: INIT_MEMORY
              value: "1G"
            - name: MAX_MEMORY
              value: "3G"
          #resources:
          #  limits:
          #    memory: "3Gi"
          #    cpu: "2000m"
          volumeMounts:
            - name: minecraft-ftb-world-infinityevolved
              mountPath: /data
          resources:
            limits:
              memory: "4Gi"
              cpu: "1000m"
      volumes:
        - name: minecraft-ftb-world-infinityevolved
          persistentVolumeClaim:
            claimName: minecraft-ftb-world-infinityevolved
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-ftb
  namespace: minecraft-ftb
spec:
  selector:
    app: minecraft-ftb
  ports:
    - name: minecraft-ftb
      port: 25565
      targetPort: 25565
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: minecraft-ftb
  namespace: minecraft-ftb
  annotations:
    external-dns.kubernetes.io/target: ftb.forcebyte.org
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - minecraft-ftb
  routes:
    - match: HostSNI(`*`)
      services:
        - name: minecraft-ftb
          port: 25565
