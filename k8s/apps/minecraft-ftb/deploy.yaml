apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-ftb-world
  namespace: minecraft-ftb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-ftb
  namespace: minecraft-ftb
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft-ftb
  template:
    metadata:
      labels:
        app: minecraft-ftb
    spec:
      containers:
        - name: minecraft-ftb
          image: itzg/minecraft-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 25565  # Internal container port
          env:
            - name: EULA
              value: "TRUE"
            - name: TZ
              value: "Etc/UTC"
            - name: TYPE
              value: "FTBA"
            - name: FTB_MODPACK_ID
              value: "35"
            - name: MEMORY
              value: "4G"
          volumeMounts:
            - name: minecraft-ftb-world
              mountPath: /data
      volumes:
        - name: minecraft-ftb-world
          persistentVolumeClaim:
            claimName: minecraft-ftb-world
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-ftb
  namespace: minecraft-ftb
spec:
  selector:
    app: minecraft-ftb
  ports:
    - name: minecraft-ftb
      port: 25565
      targetPort: 25565
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: minecraft-ftb
  namespace: minecraft-ftb
  annotations:
    external-dns.alpha.kubernetes.io/target: ftb.forcebyte.org
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - minecraft-ftb
  routes:
    - match: HostSNI(`*`)
      services:
        - name: minecraft-ftb
          port: 25565
