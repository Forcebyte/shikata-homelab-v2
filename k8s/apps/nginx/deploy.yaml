apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx
        name: nginx
        ports:
          - name: web
            containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx
spec:
  ports:
    - name: web
      port: 80
      targetPort: web
  selector:
    app: nginx
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-nginx
  namespace: nginx
  annotations:
    external-dns.kubernetes.io/target: nginx2.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nginx.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: github-oauth  # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: nginx
          port: 80