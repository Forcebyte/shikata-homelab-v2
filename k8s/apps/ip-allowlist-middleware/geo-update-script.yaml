apiVersion: v1
kind: ConfigMap
metadata:
  name: geoip-updater-script
  namespace: kube-system
data:
  update.sh: |
    #!/bin/sh
    set -eu

    CA_CIDR_URL="https://raw.githubusercontent.com/ipverse/rir-ip/master/country/ca/ipv4-aggregated.txt"
    NAMESPACE="kube-system"
    MIDDLEWARE="canada-only"
    TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    APISERVER="https://kubernetes.default.svc"
    RESOURCE_URL="$APISERVER/apis/traefik.io/v1alpha1/namespaces/$NAMESPACE/middlewaretcps/$MIDDLEWARE"

    echo "Fetching current CA CIDR list..."
    CIDRS=$(curl -sf "$CA_CIDR_URL" | grep -v '^#' | grep -v '^$')

    if [ -z "$CIDRS" ]; then
      echo "ERROR: empty CIDR list, aborting to avoid locking everyone out"
      exit 1
    fi

    COUNT=$(echo "$CIDRS" | wc -l)
    echo "Fetched $COUNT CIDR blocks"

    JSON_LIST=$(echo "$CIDRS" | awk '{printf "\"%s\",", $0}' | sed 's/,$//')
    PATCH_BODY="{\"spec\":{\"ipAllowList\":{\"sourceRange\":[${JSON_LIST}]}}}"

    echo "Patching MiddlewareTCP/$MIDDLEWARE..."
    HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
      --cacert "$CACERT" \
      -X PATCH \
      -H "Authorization: Bearer $TOKEN" \
      -H "Content-Type: application/merge-patch+json" \
      -d "$PATCH_BODY" \
      "$RESOURCE_URL")

    if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
      echo "Done."
    else
      echo "ERROR: patch failed with HTTP $HTTP_CODE"
      cat /tmp/response.json
      exit 1
    fi