apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoip-updater
  namespace: kube-system
spec:
  schedule: "0 4 * * *"   # daily at 04:00
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: geoip-updater
          restartPolicy: OnFailure
          containers:
            - name: geoip-updater
              image: curlimages/curl:8.10.1
              command: ["/bin/sh", "/scripts/update.sh"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: geoip-updater-script
                defaultMode: 0755