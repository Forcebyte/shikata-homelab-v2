apiVersion: v1
kind: ServiceAccount
metadata:
  name: geoip-updater
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geoip-updater
  namespace: kube-system
rules:
  - apiGroups: ["traefik.io"]
    resources: ["tcpmiddlewares"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geoip-updater
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: geoip-updater
    namespace: kube-system
roleRef:
  kind: Role
  name: geoip-updater
  apiGroup: rbac.authorization.k8s.io
