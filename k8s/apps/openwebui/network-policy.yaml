apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openwebui
  namespace: openwebui
spec:
  podSelector:
    matchLabels:
      app: openwebui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow all other egress (LLM APIs, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
