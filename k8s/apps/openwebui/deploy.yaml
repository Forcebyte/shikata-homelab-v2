apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data
  namespace: openwebui
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui
spec:
  replicas: 0
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:main@sha256:096c8f3d3132016210ca87b0b4dff01d2d66d9fe4fee088fae13fc30f9ac54f3 # {"$imagepolicy": "flux-system:open-webui"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # - name: WEBUI_SECRET_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: openwebui-secret
            #       key: api-token
            # - name: OLLAMA_BASE_URL
            #   value: "https://forcebyte.hyperpatrick.workers.dev"  # Update if you have Ollama
            - name: DEFAULT_LOCALE
              value: "en-US"
            - name: WEBUI_AUTH
              value: "true"
          volumeMounts:
            - name: openwebui-data
              mountPath: /app/backend/data
          # resources:
          #   limits:
          #     memory: "2Gi"
          #     cpu: "1000m"
          resources:
            limits:
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: openwebui-data
          persistentVolumeClaim:
            claimName: openwebui-data
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: openwebui
spec:
  selector:
    app: openwebui
  ports:
    - name: web
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-openwebui
  namespace: openwebui
  annotations:
    external-dns.kubernetes.io/target: "140.238.159.81"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`chat.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: umami
          namespace: kube-system
        - name: github-oauth # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: openwebui
          port: 8080
