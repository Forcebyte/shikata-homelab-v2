apiVersion: apps/v1
kind: Deployment
metadata:
  name: networking-toolbox
  namespace: toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: networking-toolbox
  template:
    metadata:
      labels:
        app: networking-toolbox
    spec:
      containers:
        - name: networking-toolbox
          image: lissy93/networking-toolbox:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: networking-toolbox
  namespace: toolbox
spec:
  selector:
    app: networking-toolbox
  ports:
    - name: web
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-toolbox
  namespace: toolbox
  annotations:
    external-dns.alpha.kubernetes.io/target: tools.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`tools.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
      services:
        - name: networking-toolbox
          port: 3000