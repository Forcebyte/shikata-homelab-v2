apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: toolbox
  namespace: toolbox
spec:
  podSelector:
    matchLabels:
      app: networking-toolbox
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow all other egress
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
