apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: prowlarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi # Adjust storage size as needed
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797 # {"$imagepolicy": "flux-system:prowlarr"}
          imagePullPolicy: Always
          ports:
            - containerPort: 9696 # Default port for Prowlarr
          resources:
            limits:
              memory: "256Mi"
          #resources:
          #  limits:
          #    memory: "256Mi"
          #    cpu: "250m"
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config # Configuration and database files
          env:
            - name: PUID
              value: "1000" # Adjust to match your user ID
            - name: PGID
              value: "1000" # Adjust to match your group ID
            - name: TZ
              value: "Etc/UTC" # Set your timezone
            - name: DOTNET_gcServer
              value: "0"
            - name: DOTNET_GCConserveMemory
              value: "5"
            - name: PROWLARR__LOG__LEVEL
              value: "info"
            - name: PROWLARR__LOG__DBENABLED
              value: "False"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 80
      targetPort: 9696
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr
  namespace: prowlarr
  annotations:
    external-dns.kubernetes.io/target: "140.238.159.81"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`prowlarr.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: rybbit
          namespace: kube-system
        - name: github-oauth # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: prowlarr
          port: 80
