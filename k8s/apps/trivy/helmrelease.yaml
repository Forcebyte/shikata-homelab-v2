apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    operator:
      # Night-batch tuning for the 2vCPU node (see scaler.yaml): the operator
      # only runs 03:00-08:00 America/Toronto, so scans never contend with
      # daytime workloads. scannerReportTTL 24h = every report refreshes
      # nightly while it is awake.
      scanJobsConcurrentLimit: 2
      scanJobTimeout: 10m
      scannerReportTTL: "24h"
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      sbomGenerationEnabled: true
    trivy:
      mode: Standalone
      resources:
        requests:
          cpu: 100m
          memory: 100M
        limits:
          cpu: 500m
          memory: 1Gi
