apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: downtify
  namespace: qbittorrent
spec:
  podSelector:
    matchLabels:
      app: downtify
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow external HTTPS egress only (Spotify embed pages, YouTube/YouTube Music, lyrics, Deezer)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Allow slskd API (same namespace; 5030 is the target port enforcement sees)
    - to:
        - podSelector:
            matchLabels:
              app: slskd
      ports:
        - protocol: TCP
          port: 5030
