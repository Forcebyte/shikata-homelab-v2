apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: terraria-world
  namespace: terraria
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraria
  namespace: terraria
spec:
  replicas: 0
  selector:
    matchLabels:
      app: terraria
  template:
    metadata:
      labels:
        app: terraria
    spec:
      automountServiceAccountToken: false
      containers:
        - name: terraria
          image: ryshe/terraria:tshock-1.4.5.6-6.1.0@sha256:b1c89f7f359abfe1171db454101853c3812b581eecd0f4eeabb9e9f77da240ef # {"$imagepolicy": "flux-system:terraria"}
          imagePullPolicy: Always
          stdin: true
          tty: true
          ports:
            - containerPort: 7777 # Terraria server port
          env:
            - name: TERRARIA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: terraria-server-secret
                  key: password
          args:
            - "-world"
            - "/root/.local/share/Terraria/Worlds/forcebyte.wld"
            - "-autocreate"
            - "3"
            - "-password"
            - "$(TERRARIA_PASSWORD)"
            - "--stats-optout"
          #resources:
          #  limits:
          #    memory: "1Gi"
          #    cpu: "500m"
          volumeMounts:
            - name: terraria-world
              mountPath: /root/.local/share/Terraria/Worlds
          resources:
            limits:
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: terraria-world
          persistentVolumeClaim:
            claimName: terraria-world
---
apiVersion: v1
kind: Service
metadata:
  name: terraria
  namespace: terraria
spec:
  selector:
    app: terraria
  ports:
    - name: terraria
      port: 7777
      targetPort: 7777
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: terraria
  namespace: terraria
  annotations:
    external-dns.kubernetes.io/target: terraria.forcebyte.org
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - terraria
  routes:
    - match: HostSNI(`*`)
      middlewares:
        - name: canada-only
      services:
        - name: terraria
          port: 7777
