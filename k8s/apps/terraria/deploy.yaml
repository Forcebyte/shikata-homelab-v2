apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: terraria-world
  namespace: terraria
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraria
  namespace: terraria
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terraria
  template:
    metadata:
      labels:
        app: terraria
    spec:
      containers:
        - name: terraria
          image: ryshe/terraria:tshock-1.4.5.6-6.1.0
          imagePullPolicy: Always
          stdin: true
          tty: true
          ports:
            - containerPort: 7777  # Terraria server port
          args:
            - "-world"
            - "/root/.local/share/Terraria/Worlds/forcebyte.wld"
            - "-autocreate"
            - "3"
            - "-password"
            - "peter35"
          resources:
            requests:
              memory: "192Mi"
              cpu: "113m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: terraria-world
              mountPath: /root/.local/share/Terraria/Worlds
      volumes:
        - name: terraria-world
          persistentVolumeClaim:
            claimName: terraria-world
---
apiVersion: v1
kind: Service
metadata:
  name: terraria
  namespace: terraria
spec:
  selector:
    app: terraria
  ports:
    - name: terraria
      port: 7777
      targetPort: 7777
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: terraria
  namespace: terraria
  annotations:
    external-dns.alpha.kubernetes.io/target: terraria.forcebyte.org
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - terraria
  routes:
    - match: HostSNI(`*`)
      services:
        - name: terraria
          port: 7777
