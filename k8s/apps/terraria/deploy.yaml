apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: terraria-world
  namespace: terraria
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: terraria-config
  namespace: terraria
data:
  serverconfig.txt: |
    # World settings
    world=/root/.local/share/Terraria/Worlds/forcebyte.wld
    autocreate=3
    worldname=forcebyte
    difficulty=0
    # Server settings
    maxplayers=8
    port=7777
    password=peter35
    motd=Welcome to Forcebyte Terraria!
    # World preferences
    secure=1
    language=en-US
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraria
  namespace: terraria
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terraria
  template:
    metadata:
      labels:
        app: terraria
    spec:
      containers:
        - name: terraria
          image: ryshe/terraria:vanilla-1.4.5.3
          imagePullPolicy: Always
          stdin: true
          tty: true
          ports:
            - containerPort: 7777  # Terraria server port
          env:
            - name: WORLD_FILENAME
              value: "forcebyte.wld"
          volumeMounts:
            - name: terraria-world
              mountPath: /root/.local/share/Terraria/Worlds
            - name: terraria-config
              mountPath: /config
      volumes:
        - name: terraria-world
          persistentVolumeClaim:
            claimName: terraria-world
        - name: terraria-config
          configMap:
            name: terraria-config
---
apiVersion: v1
kind: Service
metadata:
  name: terraria
  namespace: terraria
spec:
  selector:
    app: terraria
  ports:
    - name: terraria
      port: 7777
      targetPort: 7777
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: terraria
  namespace: terraria
  annotations:
    external-dns.alpha.kubernetes.io/target: terraria.forcebyte.org
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - terraria
  routes:
    - match: HostSNI(`*`)
      services:
        - name: terraria
          port: 7777
