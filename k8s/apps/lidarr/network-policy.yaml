apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lidarr
  namespace: qbittorrent
spec:
  podSelector:
    matchLabels:
      app: lidarr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8686
    # Allow Prowlarr (indexer sync) and same-namespace peers (Soularr)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prowlarr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qbittorrent
      ports:
        - protocol: TCP
          port: 8686
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow all other egress (indexers via Prowlarr, download clients, metadata)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
