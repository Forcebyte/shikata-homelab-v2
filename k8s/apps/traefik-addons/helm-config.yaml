apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--api"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entryPoints.dns.address=:53/udp"
      - "--entryPoints.quic.address=:853/tcp"
      - "--entryPoints.dns.address=:53/udp"
      - "--entryPoints.quic.address=:853/tcp"
    ports:
      traefik:
        expose: true
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
  ports:
    dns:
      port: 53
      expose: true
      exposedPort: 53
      protocol: TCP
    quic:
      port: 853
      expose: true
      exposedPort: 853
      protocol: TCP
