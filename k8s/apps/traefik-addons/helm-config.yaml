apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--api"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entryPoints.bittorrenttcp.address=:49155/tcp"
      - "--entryPoints.bittorrentudp.address=:49155/udp"
      - "--entryPoints.rcontcp.address=:4327/tcp"
      - "--entryPoints.rconudp.address=:4327/udp"
      - "--entryPoints.minecraft.address=:25565/tcp"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=5"
      - "--certificatesresolvers.cloudflare.acme.email=hyperpatrick@gmail.com"
      - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
      - "--log.level=DEBUG"  # Enable debug logging
      - "--global.sendAnonymousUsage=false"  # Disable anonymous statistics
    ports:
      traefik:
        expose:
          default: true
      bittorrenttcp:
        port: 49155
        exposedPort: 49155
        expose:
          default: true
        protocol: TCP
      bittorrentudp:
        port: 49155
        exposedPort: 49155
        expose:
          default: true
        protocol: UDP
      rcontcp:
        port: 4327
        exposedPort: 4327
        expose:
          default: true
        protocol: TCP
      rconudp:
        port: 4327
        exposedPort: 4327
        expose:
          default: true
        protocol: UDP
      minecraft:
        port: 25565
        exposedPort: 25565
        expose:
          default: true
        protocol: TCP
      cs2udp2:
        port: 27020
        exposedPort: 27020
        expose:
          default: true
        protocol: UDP
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    env:
      - name: CLOUDFLARE_API_KEY
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token-secret
            key: api-token
      - name: CLOUDFLARE_EMAIL
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token-secret
            key: email
    experimental:
      plugins:
        github-oauth:
          moduleName: "github.com/MuXiu1997/traefik-github-oauth-plugin"
          version: "v0.3.1"
        rybbit-feeder:
          moduleName: github.com/foxxmd/traefik-rybbit-feeder
          version: v0.13.4