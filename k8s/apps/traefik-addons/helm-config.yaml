apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    persistence:
      enabled: true
    additionalArguments:
      - "--api"
      - "--api.dashboard=false"
      - "--api.insecure=false"
      - "--entryPoints.bittorrenttcp.address=:49155/tcp"
      - "--entryPoints.bittorrentudp.address=:49155/udp"
      - "--entryPoints.rcontcp.address=:4327/tcp"
      - "--entryPoints.rconudp.address=:4327/udp"
      - "--entryPoints.minecraft.address=:25565/tcp"
      - "--entryPoints.minecraft-ftb.address=:25566/tcp"
      - "--entryPoints.minecraft-gregtech.address=:25567/tcp"
      - "--entryPoints.terraria.address=:7777/tcp"
      - "--entryPoints.terrariacalamity.address=:7778/tcp"
      - "--entryPoints.hytale.address=:5520/udp"
      - "--entryPoints.wireguard.address=:51820/udp"
      - "--entryPoints.wireguard.udp.timeout=300s"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=5"
      - "--certificatesresolvers.cloudflare.acme.email=hyperpatrick@gmail.com"
      - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.middlewares=kube-system-bouncer@kubernetescrd"
      - "--entrypoints.web.http.middlewares=kube-system-bouncer@kubernetescrd"
      - "--entrypoints.websecure.http.tls.certresolver=cloudflare"
      - "--entrypoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filePath=/var/log/traefik/access.log"
      - "--accesslog.fields.defaultmode=keep"
      - "--accesslog.fields.names.ClientUsername=drop"
      - "--accesslog.fields.headers.defaultmode=keep"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.Authorization=drop"
      - "--accesslog.fields.headers.names.Cookie=redact"
      - "--accesslog.fields.headers.names.Set-Cookie=redact"
      - "--log.level=INFO"
      - "--global.sendAnonymousUsage=false"  # Disable anonymous statistics
    ports:
      traefik:
        expose:
          default: true
      bittorrenttcp:
        port: 49155
        exposedPort: 49155
        expose:
          default: true
        protocol: TCP
      bittorrentudp:
        port: 49155
        exposedPort: 49155
        expose:
          default: true
        protocol: UDP
      rcontcp:
        port: 4327
        exposedPort: 4327
        expose:
          default: true
        protocol: TCP
      rconudp:
        port: 4327
        exposedPort: 4327
        expose:
          default: true
        protocol: UDP
      minecraft:
        port: 25565
        exposedPort: 25565
        expose:
          default: true
        protocol: TCP
      minecraft-ftb:
        port: 25566
        exposedPort: 25566
        expose:
          default: true
        protocol: TCP
      minecraft-gregtech:
        port: 25567
        exposedPort: 25567
        expose:
          default: true
        protocol: TCP
      terraria:
        port: 7777
        exposedPort: 7777
        expose:
          default: true
        protocol: TCP
      terrariacalamity:
        port: 7778
        exposedPort: 7778
        expose:
          default: true
        protocol: TCP
      hytale:
        port: 5520
        exposedPort: 5520
        expose:
          default: true
        protocol: UDP
      wireguard:
        port: 51820
        exposedPort: 51820
        expose:
          default: true
        protocol: UDP
    deployment:
      additionalVolumes:
        - name: traefik-access-logs
          hostPath:
            path: /var/log/traefik
            type: DirectoryOrCreate
    additionalVolumeMounts:
      - name: traefik-access-logs
        mountPath: /var/log/traefik
    volumes:
      - name: crowdsec-bouncer-key
        mountPath: /etc/traefik/crowdsec
        type: secret
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    env:
      - name: CLOUDFLARE_API_KEY
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token-secret
            key: api-token
      - name: CLOUDFLARE_EMAIL
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token-secret
            key: email
    experimental:
      plugins:
        github-oauth:
          moduleName: "github.com/MuXiu1997/traefik-github-oauth-plugin"
          version: "v0.3.1"
        rewrite-body:
          moduleName: "github.com/packruler/rewrite-body"
          version: "v1.2.0"
        bouncer:
          moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
          version: "v1.7.1"