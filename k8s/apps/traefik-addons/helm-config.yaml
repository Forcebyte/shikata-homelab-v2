apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--api"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entryPoints.dnstcp.address=:53/tcp"
      - "--entryPoints.dnsudp.address=:53/udp"
      - "--entryPoints.quic.address=:853/udp"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=5"
      - "--certificatesresolvers.cloudflare.acme.email=hyperpatrick@gmail.com"
      - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
    ports:
      traefik:
        expose:
          default: true
      dnsudp:
        port: 53
        exposedPort: 53
        expose:
          default: true
        protocol: UDP
      dnstcp:
        port: 53
        exposedPort: 53
        expose:
          default: true
        protocol: TCP
      quic:
        port: 853
        exposedPort: 853
        expose:
          default: true
        protocol: UDP
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    env:
      - name: CLOUDFLARE_API_KEY
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token-secret
            key: api-token
      - name: CLOUDFLARE_EMAIL
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token-secret
            key: email
