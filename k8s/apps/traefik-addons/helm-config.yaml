apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--api"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entryPoints.bittorrenttcp.address=:49155/tcp"
      - "--entryPoints.bittorrentudp.address=:49155/udp"
      - "--entryPoints.rcontcp.address=:4327/tcp"
      - "--entryPoints.rconudp.address=:4327/udp"
      - "--entryPoints.minecraft.address=:25565/tcp"
      - "--entryPoints.minecraft-ftb.address=:25566/tcp"
      - "--entryPoints.minecraft-gregtech.address=:25567/tcp"
      - "--entryPoints.terraria.address=:7777/tcp"
      - "--entryPoints.hytale.address=:5520/udp"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=5"
      - "--certificatesresolvers.cloudflare.acme.email=hyperpatrick@gmail.com"
      - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
      - "--entrypoints.websecure.http.tls=true"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filters.statuscodes=200,300-302"
      - "--accesslog.filters.retryattempts=true"
      - "--accesslog.filters.minduration=10ms"
      - "--accesslog.fields.defaultmode=keep"
      - "--accesslog.fields.names.ClientUsername=drop"
      - "--accesslog.fields.headers.defaultmode=keep"
      - "--accesslog.fields.headers.names.User-Agent=redact"
      - "--accesslog.fields.headers.names.Authorization=drop"
      - "--log.level=DEBUG"  # Enable debug logging
      - "--global.sendAnonymousUsage=false"  # Disable anonymous statistics
    ports:
      traefik:
        expose:
          default: true
      bittorrenttcp:
        port: 49155
        exposedPort: 49155
        expose:
          default: true
        protocol: TCP
      bittorrentudp:
        port: 49155
        exposedPort: 49155
        expose:
          default: true
        protocol: UDP
      rcontcp:
        port: 4327
        exposedPort: 4327
        expose:
          default: true
        protocol: TCP
      rconudp:
        port: 4327
        exposedPort: 4327
        expose:
          default: true
        protocol: UDP
      minecraft:
        port: 25565
        exposedPort: 25565
        expose:
          default: true
        protocol: TCP
      minecraft-ftb:
        port: 25566
        exposedPort: 25566
        expose:
          default: true
        protocol: TCP
      minecraft-gregtech:
        port: 25567
        exposedPort: 25567
        expose:
          default: true
        protocol: TCP
      terraria:
        port: 7777
        exposedPort: 7777
        expose:
          default: true
        protocol: TCP
      hytale:
        port: 5520
        exposedPort: 5520
        expose:
          default: true
        protocol: UDP
      cs2udp2:
        port: 27020
        exposedPort: 27020
        expose:
          default: true
        protocol: UDP
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    env:
      - name: CLOUDFLARE_API_KEY
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token-secret
            key: api-token
      - name: CLOUDFLARE_EMAIL
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token-secret
            key: email
    experimental:
      plugins:
        github-oauth:
          moduleName: "github.com/MuXiu1997/traefik-github-oauth-plugin"
          version: "v0.3.1"
        rewrite-body:
          moduleName: "github.com/packruler/rewrite-body"
          version: "v1.2.0"