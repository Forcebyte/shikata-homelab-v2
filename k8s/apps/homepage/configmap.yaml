apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Shikata Homelab
    subtitle: Underlying Homelab Configuration
    description: 
    logo: https://github.com/gethomepage/homepage/raw/main/public/android-chrome-192x192.png
    favicon: https://github.com/gethomepage/homepage/raw/main/public/favicon.ico
    theme: dark
    color: slate
    target: _self
    
    layout:
      Services:
        style: row
        columns: 3
      "Media & Downloads":
        style: row
        columns: 4
      Gaming:
        style: row
        columns: 2
      Infrastructure:
        style: row
        columns: 2
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Shortcuts:
        - Github:
            - abbr: GH
              href: https://github.com/forcebyte
        - Blog:
            - abbr: BG
              href: https://forcebyte.github.io
  services.yaml: |
    - Services:
        - Homepage:
            href: https://forcebyte.org
            description: This Dashboard
            icon: homepage.png
        - OpenWebUI:
            href: https://chat.forcebyte.org
            description: AI Chat Interface
            icon: open-webui.png
        - Tools:
            href: https://tools.forcebyte.org
            description: Network Toolbox
            icon: mdi-tools
            
    - Media & Downloads:
        - qBittorrent:
            href: https://qbittorrent.forcebyte.org
            description: Torrent Client
            icon: qbittorrent.png
        - Prowlarr:
            href: https://prowlarr.forcebyte.org
            description: Indexer Manager
            icon: prowlarr.png
        - Readarr:
            href: https://readarr.forcebyte.org
            description: Book Manager
            icon: readarr.png
        - NZBGet:
            href: https://nzbget.forcebyte.org
            description: Usenet Downloader
            icon: nzbget.png
        - Calibre:
            href: https://calibre.forcebyte.org
            description: Ebook Library Manager
            icon: calibre.png
        - Calibre Reader:
            href: https://calibre-reader.forcebyte.org
            description: Web Ebook Reader
            icon: calibre.png
        - Calibre Server:
            href: https://calibre-server.forcebyte.org
            description: Ebook Content Server
            icon: calibre.png
            
    - Gaming:
        - CS2 RCON:
            href: https://cs2rcon.forcebyte.org
            description: Counter-Strike 2 Admin
            icon: mdi-gamepad-variant
        - RCON Alt:
            href: https://rcon2.forcebyte.org
            description: Alternative RCON Interface
            icon: mdi-console
            
    - Infrastructure:
        - Nginx:
            href: https://nginx.forcebyte.org
            description: Web Server
            icon: nginx.png
        - GitHub OAuth:
            href: https://github-oauth.forcebyte.org
            description: OAuth Provider
            icon: github.png
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
    - search:
        provider: google
        target: _blank
  docker.yaml: ""