apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Shikata Homelab
    subtitle: Underlying Homelab Configuration
    description: 
    logo: https://github.com/gethomepage/homepage/raw/main/public/android-chrome-192x192.png
    favicon: https://github.com/gethomepage/homepage/raw/main/public/favicon.ico
    theme: dark
    color: slate
    target: _self
    fiveColumns: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: true
    layout:
      Services:
        style: row
        columns: 3
      Books:
        style: row
        columns: 4
      Torrenting:
        style: row
        columns: 4
      Gaming:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 3
      Cloud & Storage:
        style: row
        columns: 2
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Shortcuts:
        - Github:
            - abbr: GH
              href: https://github.com/forcebyte
        - Blog:
            - abbr: BG
              href: https://forcebyte.github.io
    - Game Servers:
        - Minecraft:
            - abbr: MC
              href: minecraft://minecraft.forcebyte.org:25565
        - Minecraft FTB:
            - abbr: FTB
              href: minecraft://ftb.forcebyte.org:25566
        - Terraria:
            - abbr: TR
              href: steam://connect/terraria.forcebyte.org:7777
  services.yaml: |
    - Services:
        - Homepage:
            href: https://forcebyte.org
            description: This Dashboard
            icon: homepage.png
        - Tools:
            href: https://tools.forcebyte.org
            description: Network Toolbox
            icon: mdi-tools
        - A Dark Room:
            href: https://darkroom.forcebyte.org
            description: Text-based Adventure Game
            icon: mdi-campfire
            
    - Books:
        - Readarr:
            href: https://readarr.forcebyte.org
            description: Book Manager
            icon: readarr.png
            widget:
              type: readarr
              url: http://readarr.qbittorrent.svc.cluster.local:80
              key: {{HOMEPAGE_VAR_READARR_KEY}}
        - Calibre:
            href: https://calibre.forcebyte.org
            description: Ebook Library Manager
            icon: calibre.png
        - Calibre Reader:
            href: https://calibre-reader.forcebyte.org
            description: Web Ebook Reader
            icon: calibre.png
    - Torrenting:
        - qBittorrent:
            href: https://qbittorrent.forcebyte.org
            description: Torrent Client
            icon: qbittorrent.png
            widget:
              type: qbittorrent
              url: http://qbittorrent.qbittorrent.svc.cluster.local:8080
              username: forcebyte
              password: {{HOMEPAGE_VAR_QBITTORRENT_KEY}}
              enableLeechProgress: true
              enableLeechSize: true
        - Prowlarr:
            href: https://prowlarr.forcebyte.org
            description: Indexer Manager
            icon: prowlarr.png
            widget:
              type: prowlarr
              url: http://prowlarr.prowlarr.svc.cluster.local:9696
              key: {{HOMEPAGE_VAR_PROWLARR_KEY}}
        - NZBGet:
            href: https://nzbget.forcebyte.org
            description: Usenet Downloader
            icon: nzbget.png
            widget:
              type: nzbget
              url: http://nzbget.qbittorrent.svc.cluster.local:6789
              username: forcebyte
              password: {{HOMEPAGE_VAR_NZBGET_KEY}}
        - Audiobookshelf:
            href: https://audiobookshelf.forcebyte.org
            description: Audiobook & Podcast Server
            icon: audiobookshelf.png
            widget:
              type: audiobookshelf
              url: http://audiobookshelf.audiobookshelf.svc.cluster.local:80
              key: {{HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY}}
    - Gaming:
        - Minecraft:
            href: https://minecraft.forcebyte.org
            description: "Vanilla Server (minecraft.forcebyte.org:25565)"
            icon: minecraft.png
            widget:
              type: minecraft
              url: udp://minecraft.forcebyte.org:25565
        - Minecraft FTB:
            href: https://ftb.forcebyte.org
            description: "FTB Modded Server (ftb.forcebyte.org:25566)"
            icon: mdi-pickaxe
            widget:
              type: minecraft
              url: udp://ftb.forcebyte.org:25566
        - Terraria:
            href: https://terraria.forcebyte.org
            description: "Terraria Server (terraria.forcebyte.org:7777)"
            icon: mdi-sword
    - Infrastructure:
        - GitHub OAuth:
            href: https://github-oauth.forcebyte.org
            description: OAuth Provider
            icon: github.png
        - Flux Orchestrator:
            href: https://flux.forcebyte.org
            description: GitOps CD Platform
            icon: flux-cd.png
        - phpMyAdmin:
            href: https://phpmyadmin.forcebyte.org
            description: Database Management
            icon: phpmyadmin.png
            
    - Cloud & Storage:
        - Rybbit Analytics:
            href: https://rybbit.forcebyte.org
            description: Web Analytics Platform
            icon: mdi-chart-line
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
    - search:
        provider: google
        target: _blank
    - openmeteo:
        units: metric
        cache: 5
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
  docker.yaml: ""