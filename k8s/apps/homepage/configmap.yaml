apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Shikata Homelab
    subtitle: Underlying Homelab Configuration
    description: 
    logo: https://github.com/gethomepage/homepage/raw/main/public/android-chrome-192x192.png
    favicon: https://github.com/gethomepage/homepage/raw/main/public/favicon.ico
    theme: dark
    color: slate
    target: _self
    
    layout:
      Services:
        style: row
        columns: 3
      "Media & Downloads":
        style: row
        columns: 4
      Gaming:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 3
      Cloud & Storage:
        style: row
        columns: 2
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Shortcuts:
        - Github:
            - abbr: GH
              href: https://github.com/forcebyte
        - Blog:
            - abbr: BG
              href: https://forcebyte.github.io
    - Game Servers:
        - Minecraft:
            - abbr: MC
              href: minecraft://minecraft.forcebyte.org:25565
        - Minecraft FTB:
            - abbr: FTB
              href: minecraft://ftb.forcebyte.org:25566
        - Terraria:
            - abbr: TR
              href: steam://connect/terraria.forcebyte.org:7777
  services.yaml: |
    - Services:
        - Homepage:
            href: https://forcebyte.org
            description: This Dashboard
            icon: homepage.png
        - OpenWebUI:
            href: https://chat.forcebyte.org
            description: AI Chat Interface
            icon: open-webui.png
        - Tools:
            href: https://tools.forcebyte.org
            description: Network Toolbox
            icon: mdi-tools
        - A Dark Room:
            href: https://darkroom.forcebyte.org
            description: Text-based Adventure Game
            icon: mdi-campfire
            
    - Media & Downloads:
        - qBittorrent:
            href: https://qbittorrent.forcebyte.org
            description: Torrent Client
            icon: qbittorrent.png
            widget:
              type: qbittorrent
              url: https://qbittorrent.forcebyte.org
        - Prowlarr:
            href: https://prowlarr.forcebyte.org
            description: Indexer Manager
            icon: prowlarr.png
            widget:
              type: prowlarr
              url: https://prowlarr.forcebyte.org
        - Readarr:
            href: https://readarr.forcebyte.org
            description: Book Manager
            icon: readarr.png
            widget:
              type: readarr
              url: https://readarr.forcebyte.org
        - NZBGet:
            href: https://nzbget.forcebyte.org
            description: Usenet Downloader
            icon: nzbget.png
            widget:
              type: nzbget
              url: https://nzbget.forcebyte.org
        - Calibre:
            href: https://calibre.forcebyte.org
            description: Ebook Library Manager
            icon: calibre.png
        - Calibre Reader:
            href: https://calibre-reader.forcebyte.org
            description: Web Ebook Reader
            icon: calibre.png
        - Calibre Server:
            href: https://calibre-server.forcebyte.org
            description: Ebook Content Server
            icon: calibre.png
        - Audiobookshelf:
            href: https://audiobookshelf.forcebyte.org
            description: Audiobook & Podcast Server
            icon: audiobookshelf.png
            widget:
              type: audiobookshelf
              url: https://audiobookshelf.forcebyte.org
            
    - Gaming:
        - CS2 RCON:
            href: https://cs2rcon.forcebyte.org
            description: Counter-Strike 2 Admin
            icon: mdi-gamepad-variant
        - RCON Alt:
            href: https://rcon2.forcebyte.org
            description: Alternative RCON Interface
            icon: mdi-console
        - Minecraft:
            href: https://minecraft.forcebyte.org
            description: "Vanilla Server (minecraft.forcebyte.org:25565)"
            icon: minecraft.png
            widget:
                type: minecraft
                url: udp://minecraft.forcebyte.org:25565
        - Minecraft FTB:
            href: https://ftb.forcebyte.org
            description: "FTB Modded Server (ftb.forcebyte.org:25566)"
            icon: mdi-pickaxe
            widget:
                type: minecraft
                url: udp://ftb.forcebyte.org:25566
        - Terraria:
            href: https://terraria.forcebyte.org
            description: "Terraria Server (terraria.forcebyte.org:7777)"
            icon: mdi-sword
        - Hytale:
            href: https://hytale.forcebyte.org
            description: "Hytale Server (hytale.forcebyte.org:5520)"
            icon: mdi-gamepad-square
            
    - Infrastructure:
        - Nginx:
            href: https://nginx.forcebyte.org
            description: Web Server
            icon: nginx.png
        - GitHub OAuth:
            href: https://github-oauth.forcebyte.org
            description: OAuth Provider
            icon: github.png
        - Headlamp:
            href: https://headlamp.forcebyte.org
            description: Kubernetes Dashboard
            icon: kubernetes-dashboard.png
        - Flux Orchestrator:
            href: https://flux.forcebyte.org
            description: GitOps CD Platform
            icon: flux-cd.png
        - Traefik:
            href: https://traefik.forcebyte.org
            description: Ingress Controller
            icon: traefik.png
            widget:
              type: traefik
              url: https://traefik.forcebyte.org
        - phpMyAdmin:
            href: https://phpmyadmin.forcebyte.org
            description: Database Management
            icon: phpmyadmin.png
            
    - Cloud & Storage:
        - Rybbit Analytics:
            href: https://rybbit.forcebyte.org
            description: Web Analytics Platform
            icon: mdi-chart-line
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
    - search:
        provider: google
        target: _blank
    - search:
        provider: google
        target: _blank
  docker.yaml: ""