apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage
  namespace: homepage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homepage
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow audiobookshelf
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: audiobookshelf
      ports:
        - protocol: TCP
          port: 80
    # Allow calibre, readarr and lidarr (qbittorrent namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qbittorrent
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8787
        - protocol: TCP
          port: 8686
    # Allow gregtech
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gregtech
      ports:
        - protocol: TCP
          port: 25565
    # Allow minecraft-ftb
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minecraft-ftb
      ports:
        - protocol: TCP
          port: 25565
    # Allow n8n
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: n8n
      ports:
        - protocol: TCP
          port: 5678
    # Allow prowlarr
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prowlarr
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 9696
    # Allow immich
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 2283
    # Allow umami
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: umami
      ports:
        - protocol: TCP
          port: 3000
    # Allow external HTTPS egress only (external APIs, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
