apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-doppelganger
  namespace: doppelganger
  annotations:
    external-dns.kubernetes.io/target: "140.238.159.81"
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`doppelganger.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: github-oauth
          namespace: kube-system
      services:
        - name: doppelganger
          port: 11345
