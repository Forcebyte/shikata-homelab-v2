apiVersion: apps/v1
kind: Deployment
metadata:
  name: standardnotes
  namespace: standardnotes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: standardnotes
  template:
    metadata:
      labels:
        app: standardnotes
    spec:
      containers:
      - image: standardnotes/server:latest
        name: standardnotes
        ports:
          - name: web
            containerPort: 3000
        env:
          - name: NODE_ENV
            value: "production"
          - name: PORT
            value: "3000"
          - name: DB_HOST
            value: "standardnotes-db"
          - name: DB_PORT
            value: "3306"
          - name: DB_USERNAME
            value: "standardnotes"
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: standardnotes-secret
                key: db-password
          - name: DB_DATABASE
            value: "standardnotes"
          - name: DB_TYPE
            value: "mysql"
          - name: REDIS_PORT
            value: "6379"
          - name: REDIS_HOST
            value: "standardnotes-cache"
          - name: CACHE_TYPE
            value: "redis"
          - name: AUTH_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: standardnotes-secret
                key: jwt-secret
          - name: VALET_TOKEN_SECRET
            valueFrom:
              secretKeyRef:
                name: standardnotes-secret
                # Intentionally reusing db-password for simplicity; consider using a dedicated secret in production
                key: db-password
---
apiVersion: v1
kind: Service
metadata:
  name: standardnotes
  namespace: standardnotes
spec:
  ports:
    - name: web
      port: 3000
      targetPort: web
  selector:
    app: standardnotes
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-standardnotes
  namespace: standardnotes
  annotations:
    external-dns.alpha.kubernetes.io/target: standardnotes.forcebyte.org
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`standardnotes.forcebyte.org`)
      kind: Rule
      middlewares:
        - name: github-oauth  # Apply the GitHub OAuth middleware
          namespace: kube-system
      services:
        - name: standardnotes
          port: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: standardnotes-db-data
  namespace: standardnotes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: standardnotes-db
  namespace: standardnotes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: standardnotes-db
  template:
    metadata:
      labels:
        app: standardnotes-db
    spec:
      containers:
      - image: mysql:8.0
        name: mysql
        ports:
          - containerPort: 3306
        env:
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: standardnotes-secret
                key: mysql-root-password
          - name: MYSQL_DATABASE
            value: "standardnotes"
          - name: MYSQL_USER
            value: "standardnotes"
          - name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: standardnotes-secret
                key: db-password
        volumeMounts:
          - name: mysql-data
            mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: standardnotes-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: standardnotes-db
  namespace: standardnotes
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: standardnotes-db
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: standardnotes-cache-data
  namespace: standardnotes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: standardnotes-cache
  namespace: standardnotes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: standardnotes-cache
  template:
    metadata:
      labels:
        app: standardnotes-cache
    spec:
      containers:
      - image: redis:6.0-alpine
        name: redis
        ports:
          - containerPort: 6379
        env:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: standardnotes-secret
                key: db-password
        volumeMounts:
          - name: redis-data
            mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: standardnotes-cache-data
---
apiVersion: v1
kind: Service
metadata:
  name: standardnotes-cache
  namespace: standardnotes
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: standardnotes-cache
  type: ClusterIP